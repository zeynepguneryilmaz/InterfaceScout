<rect x="1010" y="630" width="436" height="140" rx="14" fill="#FFFFFF" stroke="#DCE4E8" stroke-width="1.4"/><rect x="1011" y="631" width="6" height="138" rx="3" fill="#51738C"/><text x="1032" y="669" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#213246">Structure-set summaries</text><text x="1032" y="703" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#586D7B">Each structure retains all 11 maps</text><text x="1032" y="727" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#586D7B">Consensus only if mapping is valid</text>
