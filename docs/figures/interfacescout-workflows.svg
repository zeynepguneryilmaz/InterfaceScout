<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="790" viewBox="0 0 1500 790" role="img" aria-labelledby="fig-title fig-desc"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA9B3"/></marker></defs>
<title id="fig-title">InterfaceScout analysis workflows</title>
<desc id="fig-desc">Real user choices: single protein, compare two structures of the same protein, or analyze two to twenty PDB structures. All paths use the same eleven maps per structure; multi-protein consensus needs matched residues. Outputs are descriptive.</desc>
<rect x="0" y="0" width="1500" height="790" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/>
<text x="52" y="64" font-family="Inter,Arial,Helvetica,sans-serif" font-size="37" font-weight="700" text-anchor="start" fill="#192C40">Three ways to explore protein surfaces</text>
<text x="52" y="99" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#66798A">Select the analysis that matches your structural question.</text>
<text x="53" y="155" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="750" text-anchor="start" fill="#8A3858">01  CHOOSE THE STRUCTURAL WORKFLOW</text>
