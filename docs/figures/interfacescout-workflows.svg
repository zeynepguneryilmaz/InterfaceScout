<text x="81" y="403" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#486C5B">02  SHARED COMPUTATIONAL ENGINE</text>
<text x="81" y="430" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#687A85">Applied independently to every supplied protein structure</text>
