<rect x="529" y="179" width="442" height="153" rx="16" fill="#fff" stroke="#DDE4E8" stroke-width="1.3"/><rect x="529" y="179" width="442" height="5" rx="2.5" fill="#8A3858"/><text x="551" y="222" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="650" text-anchor="start" fill="#182B3F">Compare two</text><text x="551" y="258" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#697885">Two compatible states of the same protein</text><text x="551" y="283" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#697885">Compare matched residues and Top-k regions</text>
<rect x="1006" y="179" width="442" height="153" rx="16" fill="#fff" stroke="#DDE4E8" stroke-width="1.3"/><rect x="1006" y="179" width="442" height="5" rx="2.5" fill="#58758B"/><text x="1028" y="222" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" font-weight="650" text-anchor="start" fill="#182B3F">Multi-PDB</text><text x="1028" y="258" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#697885">2–20 user-supplied structures</text><text x="1028" y="283" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#697885">Analyze each; compare where valid</text>
