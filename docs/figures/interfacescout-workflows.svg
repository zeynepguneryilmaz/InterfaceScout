<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="820" viewBox="0 0 1480 820" role="img" aria-labelledby="title desc"><title id="title">InterfaceScout: three analysis workflows</title><desc id="desc">Single protein, Compare two and Multi-PDB analysis branches with shared eleven maps, surface analysis, regional chemistry, and full exports.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8d9ca9"/></marker></defs><rect width="1480" height="820" fill="#fff"/><text x="55" y="63" fill="#17243a" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="start">Explore, compare, and characterize protein surfaces</text><text x="55" y="94" fill="#68788a" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Three analysis modes · one consistent 11-map calculation per structure</text><text x="55" y="145" fill="#8c3152" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="start">CHOOSE A WORKFLOW</text>
