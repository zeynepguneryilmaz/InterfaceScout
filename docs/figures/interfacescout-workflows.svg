<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" width="1500" height="850" role="img" aria-labelledby="figTitle figDesc"><defs><marker id="arr" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8EA1AB"/></marker></defs><title id="figTitle">InterfaceScout — three analysis workflows</title><desc id="figDesc">Single protein, compare two compatible states of the same protein, or multi-PDB analysis of two to twenty structures. Each structure undergoes the same eleven-map computation. Outputs are descriptive and include full exports.</desc>
<rect width="1500" height="850" fill="#FFFFFF"/>
<text x="54" y="67" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#15283C">Three workflows, one consistent analysis</text>
<text x="54" y="105" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#637786">Choose the structural question. InterfaceScout calculates all 11 maps for every input structure.</text>
<text x="54" y="157" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#873E5A">01  SELECT AN ANALYSIS MODE</text>
<rect x="54" y="179" width="436" height="140" rx="14" fill="#FFFFFF" stroke="#DCE4E8" stroke-width="1.4"/><rect x="55" y="180" width="6" height="138" rx="3" fill="#577B68"/><text x="76" y="218" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#213246">Single protein</text><text x="76" y="252" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#586D7B">One PDB ID or local PDB</text><text x="76" y="276" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#586D7B">Inspect residue chemistry and patches</text>
<rect x="532" y="179" width="436" height="140" rx="14" fill="#FFFFFF" stroke="#DCE4E8" stroke-width="1.4"/><rect x="533" y="180" width="6" height="138" rx="3" fill="#963E5C"/><text x="554" y="218" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#213246">Compare two</text><text x="554" y="252" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#586D7B">Two states of the same protein</text><text x="554" y="276" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#586D7B">Matched-residue / Top-k comparison</text>
<rect x="1010" y="179" width="436" height="140" rx="14" fill="#FFFFFF" stroke="#DCE4E8" stroke-width="1.4"/><rect x="1011" y="180" width="6" height="138" rx="3" fill="#51738C"/><text x="1032" y="218" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#213246">Multi-PDB</text><text x="1032" y="252" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#586D7B">2–20 user-supplied structures</text><text x="1032" y="276" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#586D7B">Conditional matched-position consensus</text>
