<path d="M 1110 537 V 574 H 750 V 598" stroke="#96A6AE" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="53" y="596" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" fill="#8B3D5D" font-weight="750" text-anchor="start">03  MAP CHEMISTRY + LOCAL SPATIAL ORGANIZATION</text>
<rect x="52" y="611" width="1396" height="127" rx="17" fill="#FFFFFF" stroke="#DCE3E6" stroke-width="1.5"/>
<rect x="73" y="631" width="408" height="85" rx="11" fill="#F5F7F8" stroke="#E3E8E9" stroke-width="1.5"/>
<text x="93" y="662" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" fill="#20364A" font-weight="700" text-anchor="start">11 canonical chemistry maps</text>
<text x="93" y="693" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" fill="#647785" font-weight="400" text-anchor="start">Same structure; channel-specific rules</text>
<path d="M 491 673 H 541" stroke="#96A6AE" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="554" y="631" width="366" height="85" rx="11" fill="#F5F7F8" stroke="#E3E8E9" stroke-width="1.5"/>
<text x="573" y="662" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" fill="#20364A" font-weight="700" text-anchor="start">Multiscale neighborhoods</text>
<text x="573" y="693" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" fill="#647785" font-weight="400" text-anchor="start">6 Å and 9 Å; local chemistry support</text>
<path d="M 931 673 H 981" stroke="#96A6AE" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="993" y="631" width="430" height="85" rx="11" fill="#F5F7F8" stroke="#E3E8E9" stroke-width="1.5"/>
<text x="1012" y="662" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" fill="#20364A" font-weight="700" text-anchor="start">Coarse surface patches</text>
<text x="1012" y="693" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" fill="#647785" font-weight="400" text-anchor="start">8 Å center-defined; same-face consistency</text>
