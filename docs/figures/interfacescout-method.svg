<rect x="52" y="782" width="1396" height="119" rx="17" fill="#F2F5F5" stroke="#D9E2E5" stroke-width="1.5"/>
<text x="76" y="817" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" fill="#4D715E" font-weight="750" text-anchor="start">04  PARETO PRIORITIZATION</text>
<text x="76" y="850" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" fill="#20364A" font-weight="600" text-anchor="start">Chemistry support</text><text x="350" y="850" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" fill="#20364A" font-weight="600" text-anchor="start">Mean tRSA</text><text x="565" y="850" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" fill="#20364A" font-weight="600" text-anchor="start">Patch coherence</text><text x="851" y="850" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" fill="#20364A" font-weight="600" text-anchor="start">Orientation coherence</text>
