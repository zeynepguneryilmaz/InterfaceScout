<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930" role="img" aria-labelledby="title desc"><defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#96A6AE"/></marker></defs>
<title id="title">InterfaceScout computational methodology</title>
<desc id="desc">A prepared protein structure feeds two complementary solvent accessibility measures: whole-residue tRSA defines geometric surface membership, while side-chain scRSA defines chemical support. Glycine is a geometric member with no side-chain contribution. Eleven physicochemical maps use 6 and 9 angstrom neighborhoods, 8 angstrom patches, and four-criterion Pareto ranking.</desc>
<rect x="0" y="0" width="1500" height="930" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="53" y="60" font-family="Inter,Arial,Helvetica,sans-serif" font-size="36" fill="#192C40" font-weight="700" text-anchor="start">From solvent exposure to candidate regions</text>
<text x="53" y="92" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" fill="#657789" font-weight="400" text-anchor="start">A separation of surface geometry, chemical support, and region prioritization</text>
<text x="53" y="142" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" fill="#8B3D5D" font-weight="750" text-anchor="start">01  ONE PREPARED PROTEIN STRUCTURE</text>
<rect x="52" y="160" width="1396" height="76" rx="17" fill="#F7F8F8" stroke="#DDE3E6" stroke-width="1.5"/>
<text x="78" y="194" font-family="Inter,Arial,Helvetica,sans-serif" font-size="23" fill="#1C3144" font-weight="650" text-anchor="start">PDB coordinates</text>
<text x="78" y="220" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" fill="#6B7A86" font-weight="400" text-anchor="start">Selected chain(s) · standard protein residues</text>
<text x="795" y="197" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" fill="#2E536D" font-weight="650" text-anchor="start">One Shrake–Rupley SASA calculation</text>
<text x="795" y="220" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" fill="#667A87" font-weight="400" text-anchor="start">1.4 Å probe · 200 surface points per atom</text>
<path d="M 750 236 V 267 H 405 V 292" stroke="#96A6AE" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 750 267 H 1095 V 292" stroke="#96A6AE" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round" stroke-linejoin="round"/>
<text x="53" y="285" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" fill="#8B3D5D" font-weight="750" text-anchor="start">02  TWO COMPLEMENTARY ACCESSIBILITY DESCRIPTORS</text>
<rect x="52" y="302" width="680" height="235" rx="17" fill="#F3F7F4" stroke="#D7E5DB" stroke-width="1.5"/>
<rect x="768" y="302" width="680" height="235" rx="17" fill="#F9F3F6" stroke="#ECDCE3" stroke-width="1.5"/>
<text x="77" y="345" font-family="Inter,Arial,Helvetica,sans-serif" font-size="32" fill="#456E56" font-weight="730" text-anchor="start">tRSA</text>
<text x="190" y="344" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" fill="#1F384A" font-weight="650" text-anchor="start">total-residue relative SASA</text>
<text x="77" y="380" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" fill="#536B5C" font-weight="400" text-anchor="start">Whole-residue SASA / Tien et al. maximum ASA</text>
<circle cx="85" cy="422" r="4" fill="#9A5470"/><text x="99" y="428" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" fill="#203549" font-weight="600" text-anchor="start">Geometric exposure criterion</text><text x="99" y="451" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" fill="#697A87" font-weight="400" text-anchor="start">Surface residue if tRSA ≥ 0.05</text>
<circle cx="85" cy="488" r="4" fill="#9A5470"/><text x="99" y="494" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" fill="#203549" font-weight="600" text-anchor="start">All standard residues can contribute</text><text x="99" y="517" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" fill="#697A87" font-weight="400" text-anchor="start">GLY remains in the surface geometry</text>
<text x="792" y="345" font-family="Inter,Arial,Helvetica,sans-serif" font-size="32" fill="#8B3D5D" font-weight="730" text-anchor="start">scRSA</text>
<text x="930" y="344" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" fill="#1F384A" font-weight="650" text-anchor="start">side-chain relative SASA</text>
<text x="792" y="380" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" fill="#855D6C" font-weight="400" text-anchor="start">Non-backbone heavy-atom SASA / reference ASA</text>
<circle cx="799" cy="422" r="4" fill="#9A5470"/><text x="813" y="428" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" fill="#203549" font-weight="600" text-anchor="start">Physicochemical support</text><text x="813" y="451" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" fill="#697A87" font-weight="400" text-anchor="start">Accessible side chains inform map-specific rules</text>
<circle cx="799" cy="488" r="4" fill="#9A5470"/><text x="813" y="494" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" fill="#203549" font-weight="600" text-anchor="start">No artificial GLY side chain</text><text x="813" y="517" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" fill="#697A87" font-weight="400" text-anchor="start">GLY scRSA = 0; Cα is not counted as side chain</text>
