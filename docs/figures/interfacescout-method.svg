<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1015" width="1500" height="1015" role="img" aria-labelledby="methodTitle methodDesc">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#93A4AE"/></marker></defs>
<title id="methodTitle">InterfaceScout computational methodology</title>
<desc id="methodDesc">Prepared protein coordinates are processed with one Shrake-Rupley SASA calculation. Total-residue RSA (tRSA) selects geometrically exposed residues, while side-chain RSA (scRSA) controls chemical support. Glycine retains geometric exposure but no side-chain chemical support. Eleven maps generate coarse surface regions and four-criterion Pareto prioritization.</desc>
<rect width="1500" height="1015" fill="#fff"/>
<text x="54" y="67" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#172B40">How InterfaceScout constructs candidate regions</text>
<text x="54" y="104" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#667986">Geometry and chemical support are deliberately separate quantities.</text>
<text x="54" y="158" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#873E5A">01  STRUCTURAL INPUT &amp; SASA</text>
<rect x="54" y="179" width="1392" height="104" rx="15" fill="#F8FAFA" stroke="#DCE4E7" stroke-width="1.3"/>
<text x="83" y="222" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#223A4D">Prepared protein structure</text>
<text x="83" y="253" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#607586">Selected chain(s) · standard amino-acid residues</text>
<text x="803" y="222" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#223A4D">Shrake–Rupley calculation</text>
<text x="803" y="253" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#607586">1.4 Å solvent probe · 200 points per atom</text>
<path d="M370 284 V308 H390 V336" fill="none" stroke="#93A4AE" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1120 284 V308 H1110 V336" fill="none" stroke="#93A4AE" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="54" y="327" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#873E5A">02  DUAL ACCESSIBILITY DEFINITIONS</text>
<rect x="54" y="345" width="676" height="247" rx="15" fill="#F3F8F4" stroke="#D7E5DA" stroke-width="1.3"/>
<rect x="770" y="345" width="676" height="247" rx="15" fill="#FBF5F7" stroke="#E8D8E0" stroke-width="1.3"/>
<text x="82" y="387" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#4A765E">tRSA</text>
<text x="185" y="385" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#223A4D">Geometric surface accessibility</text>
<text x="82" y="421" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#5C7363">Total-residue SASA / theoretical maximum ASA</text>
<rect x="82" y="449" width="621" height="66" rx="11" fill="#fff" stroke="#DBE6DE" stroke-width="1.3"/>
<text x="103" y="476" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#254936">Surface gate: tRSA ≥ 0.05</text>
<text x="103" y="498" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#607465">All 20 standard residue types can be considered.</text>
<text x="82" y="555" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#4A765E">GLY remains part of surface geometry.</text>
<text x="800" y="387" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#923F5E">scRSA</text>
<text x="920" y="385" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#223A4D">Side-chain chemical accessibility</text>
<text x="800" y="421" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#7D6670">Non-backbone heavy-atom SASA / reference ASA</text>
<rect x="800" y="449" width="618" height="66" rx="11" fill="#fff" stroke="#EADCE2" stroke-width="1.3"/>
<text x="821" y="476" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#71364F">Channel-specific chemical support</text>
<text x="821" y="498" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#866B77">Uses accessible functional side-chain groups.</text>
<text x="800" y="555" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#923F5E">GLY has scRSA = 0; Cα is not a side chain.</text>
<path d="M392 593 V635 H750 V660" fill="none" stroke="#93A4AE" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1108 593 V635 H750" fill="none" stroke="#93A4AE" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="54" y="651" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#873E5A">03  PHYSICOCHEMICAL MAPS &amp; SPATIAL PATCHES</text>
<rect x="54" y="670" width="1392" height="158" rx="15" fill="#FFFFFF" stroke="#DCE4E7" stroke-width="1.3"/>
<rect x="82" y="700" width="382" height="97" rx="11" fill="#F7F9F9" stroke="#E2E8EA" stroke-width="1.3"/>
<text x="101" y="738" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#21394C">11 canonical chemistry maps</text>
<text x="101" y="769" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#627686">Each map is computed for every structure.</text>
<path d="M475 748 H520" fill="none" stroke="#93A4AE" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="537" y="700" width="377" height="97" rx="11" fill="#F7F9F9" stroke="#E2E8EA" stroke-width="1.3"/>
<text x="555" y="738" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#21394C">Multiscale neighborhoods</text>
<text x="555" y="769" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#627686">6 Å and 9 Å · local chemical context</text>
<path d="M925 748 H970" fill="none" stroke="#93A4AE" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="989" y="700" width="429" height="97" rx="11" fill="#F7F9F9" stroke="#E2E8EA" stroke-width="1.3"/>
<text x="1007" y="738" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#21394C">Surface candidate patches</text>
<text x="1007" y="769" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#627686">8 Å coarse radius · same-face consistency</text>
<path d="M750 830 V864" fill="none" stroke="#93A4AE" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="54" y="873" width="1392" height="111" rx="15" fill="#F3F6F6" stroke="#DDE6E6" stroke-width="1.3"/>
<text x="82" y="913" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#4F7463">04  MULTI-CRITERION PARETO PRIORITIZATION</text>
<text x="82" y="947" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#253A4C">Chemistry support</text>
<text x="365" y="947" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#253A4C">Mean geometric tRSA</text>
<text x="721" y="947" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#253A4C">Patch coherence</text>
<text x="1007" y="947" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#253A4C">Orientation coherence</text>
<text x="82" y="974" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#627686">Non-dominated candidate regions; no calibrated adsorption-affinity prediction.</text>
</svg>