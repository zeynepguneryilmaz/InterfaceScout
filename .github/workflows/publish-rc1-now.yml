name: Publish three OS downloads to existing v1.1.0-rc1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rc1-now.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact cleaned application revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source and create Windows, macOS and Linux downloads
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend examples/1LYZ tools
          python tools/build_release_archives.py --out dist --version v1.1.0-rc1
          test -s dist/InterfaceScout-v1.1.0-rc1-Windows-source.zip
          test -s dist/InterfaceScout-v1.1.0-rc1-macOS-source.zip
          test -s dist/InterfaceScout-v1.1.0-rc1-Linux-source.zip
          test -s dist/InterfaceScout_v1_1_0_rc1_publication_bundle.zip
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          for archive in Path('dist').glob('*.zip'):
              with ZipFile(archive) as z:
                  assert z.testzip() is None
                  p=set(z.namelist())
                  for needed in ['InterfaceScout/backend/app.py','InterfaceScout/frontend/index.html','InterfaceScout/examples/README.md']:
                      assert needed in p, (archive,needed)
          PY
      - name: Align v1.1.0-rc1 tag with newly packaged code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f v1.1.0-rc1 "$GITHUB_SHA"
          git push --force origin refs/tags/v1.1.0-rc1:refs/tags/v1.1.0-rc1
      - name: Attach three platform-specific downloads to existing rc1 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.1.0-rc1
          gh release delete-asset v1.1.0-rc1 InterfaceScout_v1.1.0_rc1_publication_bundle.zip.sha256 --yes || true
          gh release upload v1.1.0-rc1 dist/*.zip dist/SHA256SUMS.txt --clobber
          gh release view v1.1.0-rc1 --json assets --jq '.assets[].name'
