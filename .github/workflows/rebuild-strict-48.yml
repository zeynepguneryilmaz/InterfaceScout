name: Rebuild strictly quality-qualified CATH-nonredundant 48
on:
  push:
    paths:
      - .github/workflows/rebuild-strict-48.yml
      - validation/rebuild_strict_48.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests gemmi==0.7.4 biopython==1.85
      - name: Screen structural quality, full assembly, CATH family, and sequence
        run: python -u validation/rebuild_strict_48.py
      - name: Preserve selected and rejected audit records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-48-scientific-selection
          path: |
            strict_panel_48/*.json
            strict_panel_48/*.csv
          if-no-files-found: warn
