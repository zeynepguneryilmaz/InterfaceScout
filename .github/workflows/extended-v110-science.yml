name: v1.1 independent baselines, criterion dependence and case studies
on:
  workflow_dispatch:
  push:
    paths:
      - 'validation/extended_v110_science.py'
      - '.github/workflows/extended-v110-science.yml'
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install gemmi==0.7.4 pandas scipy
      - run: python -u validation/extended_v110_science.py --panel-shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-panel-${{ matrix.shard }}
          path: extended_v110/
          retention-days: 90
  cases:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install gemmi==0.7.4 pandas scipy
      - run: python -u validation/extended_v110_science.py --cases
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-cases
          path: extended_v110/
          retention-days: 90
  aggregate:
    needs: [panel, cases]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install gemmi==0.7.4 pandas scipy
      - uses: actions/download-artifact@v4
        with:
          pattern: extended-*
          path: extended_v110
          merge-multiple: true
      - run: python -u validation/extended_v110_science.py --aggregate extended_v110
      - uses: actions/upload-artifact@v4
        with:
          name: extended-v110-full-scientific-evidence
          path: extended_v110/
          retention-days: 90
