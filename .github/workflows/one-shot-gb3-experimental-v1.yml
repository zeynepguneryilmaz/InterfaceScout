name: one-shot GB3 experimental holdout v1
on:
  push:
    branches: [validation-study]
    paths:
      - '.github/workflows/one-shot-gb3-experimental-v1.yml'
      - 'validation/run_gb3_experimental_holdout.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation-study
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy biopython fastapi pydantic
      - run: python validation/run_gb3_experimental_holdout.py
      - name: commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add validation/prospective_holdout/results_gb3_experimental_v1
          git commit -m 'Add GB3 frozen experimental holdout result' || exit 0
          git pull --rebase origin validation-study
          git push origin validation-study
