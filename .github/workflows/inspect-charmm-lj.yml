name: Inspect CHARMM36 LJ layout
on:
  push:
    branches: [development/v2.0.0]
    paths:
      - 'validation/inspect_charmm_lj.py'
      - '.github/workflows/inspect-charmm-lj.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - run: python validation/inspect_charmm_lj.py
      - uses: actions/upload-artifact@v4
        with:
          name: charmm-lj-layout
          path: validation/charmm_lj_force_layout.json
