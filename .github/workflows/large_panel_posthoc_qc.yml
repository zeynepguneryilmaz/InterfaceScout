name: Large-panel post-hoc QC

on:
  workflow_dispatch:
  push:
    branches:
      - large-panel-freeze-2026-10-13
    paths:
      - 'scripts/validation/posthoc_large_panel_qc.py'
      - '.github/workflows/large_panel_posthoc_qc.yml'

permissions:
  contents: write

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: large-panel-freeze-2026-10-13
      - name: Compute post-hoc QC
        run: python scripts/validation/posthoc_large_panel_qc.py
      - name: Commit QC outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/large_panel_285_2026-10-13/results/posthoc_qc.json
          git add validation/large_panel_285_2026-10-13/results/POSTHOC_QC.md
          if git diff --cached --quiet; then
            echo "No QC changes to commit"
          else
            git commit -m "Add post-hoc size and confidence QC for large panel"
            git push origin HEAD:large-panel-freeze-2026-10-13
          fi
