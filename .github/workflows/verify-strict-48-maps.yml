name: Verify InterfaceScout 11 maps on strict 48 protein panel
on:
  push:
    paths:
      - .github/workflows/verify-strict-48-maps.yml
      - validation/strict_panel_compat_48.py
      - validation/strict_48_selected_candidates_v1.csv
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-all-48:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install InterfaceScout dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install gemmi==0.7.4
      - name: Download full assemblies, preserve unique chain IDs, and verify all 11 maps
        run: python -u validation/strict_panel_compat_48.py
      - name: Upload all 48 compatibility records and prepared hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-48-interfacescout-11map
          path: |
            strict_panel_48/compatibility_48.json
            strict_panel_48/compatibility_48.csv
          if-no-files-found: warn
