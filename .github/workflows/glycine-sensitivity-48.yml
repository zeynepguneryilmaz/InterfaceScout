name: InterfaceScout glycine sensitivity 48 structures 11 maps
on:
  push:
    paths:
      - 'validation/glycine_sensitivity_48.py'
      - '.github/workflows/glycine-sensitivity-48.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install gemmi==0.7.4 pandas requests
      - run: python -u validation/glycine_sensitivity_48.py --shard ${{ matrix.shard }} --shards 4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glycine-shard-${{ matrix.shard }}
          path: glycine_sensitivity_48/
          retention-days: 90
  aggregate:
    needs: compute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: glycine-shard-*
          path: glycine_sensitivity_48
          merge-multiple: true
      - run: python validation/glycine_sensitivity_48.py --aggregate glycine_sensitivity_48
      - uses: actions/upload-artifact@v4
        with:
          name: glycine-48-all-maps-complete
          path: glycine_sensitivity_48/
          retention-days: 90
