name: One-shot core pH sensitivity
on:
  push:
    branches: [validation-study]
    paths: ['.github/workflows/one-shot-core-ph-sensitivity.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation-study
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scipy biopython fastapi pydantic
      - run: python validation/run_core_ph_sensitivity.py
      - run: |
          git config user.name 'InterfaceScout validation bot'
          git config user.email 'validation@interfacescout.local'
          git add validation/packages/all15/results_core_ph_sensitivity
          git commit -m 'Add final core pH sensitivity results' || exit 0
          git pull --rebase origin validation-study
          git push origin validation-study
