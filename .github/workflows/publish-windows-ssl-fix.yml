name: Publish Windows SSL setup fix to rc1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-windows-ssl-fix.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build three release archives
        run: |
          set -euo pipefail
          python tools/build_release_archives.py --out dist --version v1.1.0-rc1
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          a=list(Path('dist').glob('*.zip'))
          assert len(a)==3
          for p in a:
              with ZipFile(p) as z:
                  assert z.testzip() is None
                  if 'Windows' in p.name:
                      assert 'InterfaceScout/backend/dependency_check.py' in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rc1-windows-ssl-fix-platform-archives
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows
          - os: macos-15-intel
            platform: macOS
          - os: ubuntu-24.04
            platform: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: rc1-windows-ssl-fix-platform-archives
          path: dist
      - name: Extract actual platform archive
        shell: bash
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          path='dist/InterfaceScout-v1.1.0-rc1-${{ matrix.platform }}-source.zip'
          with ZipFile(path) as z:
              assert z.testzip() is None
              z.extractall('extracted')
          PY
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r extracted/InterfaceScout/backend/requirements.txt
      - name: Verify extracted app health and real PDB analysis
        run: python tests/verify_release_runtime.py extracted/InterfaceScout tests/fixtures/4AKE_A.pdb
  publish:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rc1-windows-ssl-fix-platform-archives
          path: dist
      - name: Publish exactly three updated rc1 assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f v1.1.0-rc1 "$GITHUB_SHA"
          git push --force origin refs/tags/v1.1.0-rc1:refs/tags/v1.1.0-rc1
          gh release upload v1.1.0-rc1 dist/*.zip --clobber
          mapfile -t a < <(gh release view v1.1.0-rc1 --json assets --jq '.assets[].name')
          test "${#a[@]}" -eq 3
          printf '%s\n' "${a[@]}"
