name: Final v1.1.0 48-structure all-map verification
on:
  push:
    paths:
      - 'validation/final_v110_48.py'
      - '.github/workflows/final-v110-48.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install gemmi==0.7.4 pandas requests
      - run: python -u validation/final_v110_48.py --shard ${{ matrix.shard }} --shards 4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-v110-48-shard-${{ matrix.shard }}
          path: final_v110_48/
          retention-days: 90
  aggregate:
    needs: compute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: final-v110-48-shard-*
          path: final_v110_48
          merge-multiple: true
      - run: python validation/final_v110_48.py --aggregate final_v110_48
      - uses: actions/upload-artifact@v4
        with:
          name: final-v110-48-complete
          path: final_v110_48/
          retention-days: 90
