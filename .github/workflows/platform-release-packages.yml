name: Validate OS-specific InterfaceScout packages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: interface-scout-platform-release
  cancel-in-progress: false
jobs:
  build:
    name: Validate and package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
          - platform: macos
            runner: macos-15-intel
          - platform: linux
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned application dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify current repository panel and scope
        run: python validation/repository_consistency_check.py
      - name: Run application unit tests
        run: python -m unittest discover -s tests -q
      - name: Check frontend JavaScript parsing
        shell: bash
        run: |
          node --check frontend/decision_workflow.js
          node --check frontend/ensemble_ui.js
      - name: Check OS launchers
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            windows) cmd.exe /c "call run_local.bat --check" ;;
            macos) bash run_local.sh --check; bash start.command --check; bash "Create Desktop App.command" --check ;;
            linux) bash run_local.sh --check; bash start.sh --check; bash "Create Desktop Shortcut.sh" --check ;;
          esac
      - name: Build and verify a platform-specific application ZIP
        run: python scripts/package_platform_release.py --platform ${{ matrix.platform }}
      - name: Store validated distributable
        uses: actions/upload-artifact@v4
        with:
          name: InterfaceScout-1.1.0-${{ matrix.platform }}
          path: dist/release/
          retention-days: 90
          if-no-files-found: error
