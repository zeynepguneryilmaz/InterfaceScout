name: InterfaceScout 2.0 nonpolar development

on:
  push:
    branches:
      - development/v2.0.0
    paths:
      - 'backend/nonpolar_energy.py'
      - 'backend/app.py'
      - 'backend/requirements.txt'
      - 'validation/nonpolar_development.py'
      - '.github/workflows/v2-nonpolar-development.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Run full nonpolar development diagnostic
        run: python validation/nonpolar_development.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: interfacescout-v2-nonpolar-development
          path: validation/nonpolar_development_report.json
