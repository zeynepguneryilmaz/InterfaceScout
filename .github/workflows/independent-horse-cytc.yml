name: Independent literature labels (horse cyt c silica 2019)
on:
  push:
    branches: [independent-intended-use-validation-2026-11-18]
permissions:
  contents: read
jobs:
  horse-cytc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen unmodified InterfaceScout
        run: |
          python -m pip install -q -r backend/requirements.txt
          mkdir -p independent_evidence/2019_horse_cytc
      - name: Calculate independently reported pH 3 and 7 silica contacts
        shell: bash
        run: |
          curl -fsSL --retry 2 https://files.rcsb.org/download/1HRC.pdb -o independent_evidence/2019_horse_cytc/1HRC_raw.pdb
          cat > independent_evidence/2019_horse_cytc/benchmark.py <<'PY'
          # Source: Bharti et al., Soft Matter 2019 DOI:10.1039/C8SM01909F.
          # Labels are transcribed directly BEFORE running frozen IS algorithm.
          # Data are reported MD residues, NOT experimentally established atomistic contacts.
          import json,sys,os,hashlib,traceback
          from pathlib import Path
          sys.path.insert(0,str(Path('backend').resolve()))
          from interface_engine import analyze_all_maps
          output=Path('independent_evidence/2019_horse_cytc')
          labels={3.0:{5:'LYS',8:'LYS'},7.0:{8:'LYS',16:'GLN',79:'LYS',86:'LYS',87:'LYS'}}
          raw=(output/'1HRC_raw.pdb').read_text()
          lines=[]
          for l in raw.splitlines():
              if not l.startswith('ATOM  '):continue
              if l[21]!='A' or l[16] not in (' ','A'):continue
              if l[76:78].strip().upper() in ('H','D'):continue
              if l[16]=='A':l=l[:16]+' '+l[17:]
              lines.append(l)
          pdb='\n'.join(lines)+'\nEND\n'
          (output/'1HRC_chainA_protein_only.pdb').write_text(pdb)
          structure={}
          for line in lines:
              try:n=int(line[22:26])
              except:continue
              structure[n]=line[17:20]
          print('PDB',len(structure),'residues','observed numbering',min(structure),max(structure))
          results={'source':'10.1039/C8SM01909F','pdb':'1HRC','species':'Equus caballus','protein_sha256':hashlib.sha256(pdb.encode()).hexdigest(),'cases':{},'labelling_pH':labels,'amino_acid_verification':{}}
          for ph,sites in labels.items():
              for n,aa in sites.items():
                  results['amino_acid_verification'][str(n)]={'expected':aa,'found':structure.get(n),'match':structure.get(n)==aa}
              r=analyze_all_maps(pdb_text=pdb,chain='A',pH=ph)
              maps={}
              for chem,v in r['maps'].items():
                  maps[chem]={
                     'patches':[{'rank':i+1,'center':patch.get('center_key'),'members':patch['members'],'n_members':len(patch['members'])} for i,patch in enumerate(v['patches'])],
                     'n_patches':len(v['patches'])
                  }
              an=maps['anionic']
              relevant={f'A:{n}:' for n in sites}
              print('pH',ph,'target',sorted(relevant),'n_patches',an['n_patches'])
              for k in (1,3,5,10):
                  selected=set().union(*(set(p['members']) for p in an['patches'][:k]))
                  hit=sorted(relevant & selected)
                  print('top',k,'hit',hit,'recall',len(hit)/len(relevant),'selected',len(selected))
              results['cases'][str(ph)]={'expected_residues':sites,'n_maps':r['n_maps'],'maps':maps,'surface_residues':r['diagnostics'].get('surface_residue_keys',[])}
          (output/'frozen_output.json').write_text(json.dumps(results,indent=2))
          if not all(x['match'] for x in results['amino_acid_verification'].values()):
              print('WARNING: SOURCE RESIDUE IDENTITIES ARE NOT VERIFIED WITH STRUCTURE')
          PY
          python independent_evidence/2019_horse_cytc/benchmark.py | tee independent_evidence/2019_horse_cytc/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heldout-2019-horse-cytc-silica-ph3-ph7
          path: independent_evidence/2019_horse_cytc/
          retention-days: 30
