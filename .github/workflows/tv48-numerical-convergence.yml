name: TV48 APBS numerical convergence — SAS directions and uncapped grid
on:
  push:
    branches: [main]
    paths:
      - 'validation/tv48_numerical_convergence.py'
      - '.github/workflows/tv48-numerical-convergence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sampling:
    name: SAS directions shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual external solvers and SciPy
        run: |
          sudo apt-get update
          sudo apt-get install -y apbs
          python -m pip install -r backend/requirements.txt
          python -m pip install "pdb2pqr==3.7.1" "gemmi==0.7.4" "pandas==2.2.3" "matplotlib==3.10.1"
          which apbs
          which pdb2pqr
      - name: Run 42 84 162 SAS directions on 6 frozen structures
        run: python -u validation/tv48_numerical_convergence.py --sampling-shard ${{ matrix.shard }} --shards 8
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergence-sampling-${{ matrix.shard }}
          path: tv48_apbs_convergence/
          retention-days: 90
          if-no-files-found: warn
  grid:
    name: APBS genuinely uncapped 0.4A grid ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual solvers for uncapped grids
        run: |
          sudo apt-get update
          sudo apt-get install -y apbs
          python -m pip install -r backend/requirements.txt
          python -m pip install "pdb2pqr==3.7.1" "gemmi==0.7.4" "pandas==2.2.3" "matplotlib==3.10.1"
          which apbs
          which pdb2pqr
          free -h
      - name: Run actual APBS on 0.8 0.5 0.4 capped and uncapped grids
        run: python -u validation/tv48_numerical_convergence.py --grid-shard ${{ matrix.shard }} --shards 8
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convergence-grid-${{ matrix.shard }}
          path: tv48_apbs_convergence/
          retention-days: 90
          if-no-files-found: warn
  aggregate:
    if: always()
    needs: [sampling,grid]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "pandas==2.2.3" "matplotlib==3.10.1"
      - uses: actions/download-artifact@v4
        with:
          pattern: convergence-*
          path: tv48_apbs_convergence
          merge-multiple: true
      - name: Require 48 sampling and 4 cap-sensitive APBS grids and plot
        run: python -u validation/tv48_numerical_convergence.py --aggregate --shards 8
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TV48-APBS-Numerical-Convergence-Results
          path: tv48_apbs_convergence/
          retention-days: 90
          if-no-files-found: warn
