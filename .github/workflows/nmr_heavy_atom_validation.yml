name: NMR heavy-atom validation
on:
  push:
    paths:
      - '.github/workflows/nmr_heavy_atom_validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Run first-model heavy-atom NMR structures
        run: |
          cat > /tmp/run_nmr_heavy.py <<'PY'
          import sys, json, urllib.request
          from pathlib import Path
          from Bio.PDB import PDBParser, PDBIO, Select
          sys.path.insert(0, str(Path('backend').resolve()))
          import main as m
          class Model0Heavy(Select):
              def accept_model(self, model): return int(model.id)==0
              def accept_atom(self, atom):
                  e=(getattr(atom,'element','') or '').strip().upper()
                  n=atom.get_name().strip().upper()
                  return 0 if e=='H' or n.startswith('H') else 1
          specs=[('GB3','2OED','A',7.4),('beta2-microglobulin','1JNJ','A',7.4),('Acylphosphatase','2K7K','A',7.0)]
          out=Path('nmr_heavy_outputs'); out.mkdir(exist_ok=True)
          for protein,pdb,chain,ph in specs:
              raw=out/f'{pdb}_raw.pdb'; urllib.request.urlretrieve(f'https://files.rcsb.org/download/{pdb}.pdb',raw)
              st=PDBParser(QUIET=True).get_structure(pdb,str(raw))
              one=out/f'{pdb}_model1_heavy.pdb'; io=PDBIO(); io.set_structure(st); io.save(str(one),Model0Heavy())
              req=m.AnalyzeRequest(pdb_text=one.read_text(),chain=chain,env=m.EnvParams(pH=ph,ionic=150,temp=298))
              r=m.analyze(req); (out/f'{protein}_{pdb}_pH{ph}.json').write_text(json.dumps(r,indent=2))
              print('RUN_OK',protein,'surface',len(r['surface_residues']))
              print('CHECK_LYS',[(x['res_seq'],x['res_name'],round(x['scrsa'],3)) for x in r['all_residues'] if x['res_name']=='LYS'][:20])
              for ck,cv in r['chemistries'].items():
                  top=sorted(cv.get('residues',[]),key=lambda x:x.get('multiscale_persistence',-1),reverse=True)[:10]
                  print('TOP10',protein,ck,[(x['res_name'],x['res_seq'],x['multiscale_persistence']) for x in top])
          PY
          python /tmp/run_nmr_heavy.py
      - uses: actions/upload-artifact@v4
        with:
          name: nmr-heavy-results
          path: nmr_heavy_outputs/
