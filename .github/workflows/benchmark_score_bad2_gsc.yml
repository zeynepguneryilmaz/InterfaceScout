name: Score BAD 2.0 direct adsorption propensity
on:
  push:
    branches: [benchmark-scoring-v1-2026-10-07]
    paths:
      - 'validation/benchmark_v1_2026-10-06/run_bad2_adsorption_propensity.py'
      - 'validation/benchmark_v1_2026-10-06/TRIGGER_BAD2_GSC'
      - '.github/workflows/benchmark_score_bad2_gsc.yml'
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt pandas lxml scipy
      - run: python validation/benchmark_v1_2026-10-06/run_bad2_adsorption_propensity.py
      - uses: actions/upload-artifact@v4
        with:
          name: bad2-direct-adsorption-gsc-results
          path: validation/benchmark_v1_2026-10-06/direct_adsorption_bad_v1_2026-10-07/
          retention-days: 90
