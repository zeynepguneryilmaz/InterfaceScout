name: V2 alpha benchmark
on:
  push:
    paths:
      - '.github/workflows/v2_alpha_benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt scikit-learn
      - name: Run benchmark
        run: |
          cat > /tmp/v2_bench.py <<'PY'
          import json, math, sys
          from pathlib import Path
          import numpy as np
          from sklearn.metrics import roc_auc_score, average_precision_score
          sys.path.insert(0, str(Path('backend').resolve()))
          import main as v1
          from v2.engine import analyze_v2

          # Frozen material mappings / experimental-like conditions.
          specs = [
            dict(name='BSA', pdb='4F5S', chain='A', ph=7.4, surface='silica', v1chem='anionic', gt_ranges=[(196,383)], gt_exact=None, tier='B-domain'),
            dict(name='HSA', pdb='2VUF', chain='A', ph=6.2, surface='paa_fe3o4', v1chem='anionic', gt_ranges=[(373,389),(403,410),(414,428)], gt_exact=None, tier='A/B-peptide'),
            dict(name='HCAII_pH6.3', pdb='2CBA', chain='A', ph=6.3, surface='silica', v1chem='anionic', gt_ranges=None, gt_exact=[10], tier='A-anchor'),
            dict(name='HCAII_pH8.3', pdb='2CBA', chain='A', ph=8.3, surface='silica', v1chem='anionic', gt_ranges=None, gt_exact=[37], tier='A-anchor'),
            dict(name='GB3', pdb='2OED', chain='A', ph=7.4, surface='citrate_au', v1chem='anionic', gt_ranges=None, gt_exact=[4,13,50], tier='A-exact'),
            dict(name='Ubiquitin', pdb='1UBQ', chain='A', ph=7.4, surface='citrate_au', v1chem='anionic', gt_ranges=None, gt_exact=[2,15,18], tier='A-csp-caveat'),
            dict(name='Catalase', pdb='1TGU', chain=None, ph=7.4, surface='polystyrene', v1chem='hydrophobic', gt_ranges=[(350,380)], gt_exact=None, tier='B-region'),
            dict(name='L-asparaginase-II', pdb='3ECA', chain=None, ph=7.5, surface='aloh', v1chem='cationic', gt_ranges=[(250,310)], gt_exact=None, tier='B-region'),
            dict(name='RNase-A', pdb='7RSA', chain='A', ph=7.0, surface='silica', v1chem='anionic', gt_ranges=None, gt_exact=None, tier='PREDICTION_ONLY'),
            dict(name='Lysozyme', pdb='3LN2', chain='A', ph=7.0, surface='silica', v1chem='anionic', gt_ranges=None, gt_exact=None, tier='PREDICTION_ONLY'),
            dict(name='beta2-microglobulin', pdb='1JNJ', chain='A', ph=7.4, surface='mpa_au', v1chem='anionic', gt_ranges=None, gt_exact=None, tier='PREDICTION_ONLY'),
            dict(name='Acylphosphatase', pdb='2K7K', chain='A', ph=7.0, surface='silica', v1chem='anionic', gt_ranges=[(22,33),(55,66)], gt_exact=None, tier='B-region-approx'),
            dict(name='Transferrin', pdb='1SUV', chain=None, ph=7.4, surface='polystyrene', v1chem='hydrophobic', gt_ranges=[(140,160),(480,500)], gt_exact=None, tier='B-region'),
          ]

          def in_gt(num, s):
            if s['gt_exact'] is not None:
              return num in set(s['gt_exact'])
            if s['gt_ranges'] is not None:
              return any(a <= num <= b for a,b in s['gt_ranges'])
            return False

          rows=[]
          for s in specs:
            print('\nRUN',s['name'],s['pdb'],s['surface'],'pH',s['ph'])
            try:
              req=v1.AnalyzeRequest(pdb_id=s['pdb'], chain=s['chain'], env=v1.EnvParams(pH=s['ph'],ionic=150,temp=298))
              r1=v1.analyze(req)
              c=r1['chemistries'][s['v1chem']]
              v1map={int(x['res_seq']): float(x.get('multiscale_persistence',0.0)) for x in c.get('patch_centers',[])}
              rv2=analyze_v2(surface=s['surface'], pdb_id=s['pdb'], chain=s['chain'], pH=s['ph'], top_n=20)
              v2map={int(x['res_seq']): float(x.get('score',0.0)) for x in rv2.get('patches',rv2.get('all_patches',rv2.get('top_patches',[])))}
              if len(v2map) < 5:
                # top_patches may be the only exposed list in current alpha; use it without inventing scores for missing centers.
                v2map={int(x['res_seq']): float(x.get('score',0.0)) for x in rv2.get('top_patches',[])}

              surf=r1['surface_residues']
              nums=[int(x['res_seq']) for x in surf]
              gt_available = s['gt_exact'] is not None or s['gt_ranges'] is not None
              out=dict(name=s['name'],pdb=s['pdb'],surface=s['surface'],ph=s['ph'],tier=s['tier'])
              out['v1_top10']=[x['res_seq'] for x in sorted(c.get('patch_centers',[]),key=lambda z:z.get('multiscale_persistence',0),reverse=True)[:10]]
              out['v2_top10']=[x['res_seq'] for x in rv2.get('top_patches',[])[:10]]
              out['v2_top3']=[x['res_seq'] for x in rv2.get('top_patches',[])[:3]]
              if gt_available:
                y=np.array([1 if in_gt(n,s) else 0 for n in nums],dtype=int)
                sv1=np.array([v1map.get(n,0.0) for n in nums],dtype=float)
                sv2=np.array([v2map.get(n,0.0) for n in nums],dtype=float)
                if y.sum()>0 and y.sum()<len(y):
                  out['prevalence']=float(y.mean())
                  out['v1_auc']=float(roc_auc_score(y,sv1)); out['v1_ap']=float(average_precision_score(y,sv1))
                  out['v2_auc']=float(roc_auc_score(y,sv2)); out['v2_ap']=float(average_precision_score(y,sv2))
                gtset={n for n in nums if in_gt(n,s)}
                out['gt_surface_n']=len(gtset)
                out['v1_hit_top3']=len(gtset.intersection(out['v1_top10'][:3]))
                out['v2_hit_top3']=len(gtset.intersection(out['v2_top3']))
                out['v1_hit_top10']=len(gtset.intersection(out['v1_top10']))
                out['v2_hit_top10']=len(gtset.intersection(out['v2_top10']))
              rows.append(out)
              print(json.dumps(out,sort_keys=True))
            except Exception as e:
              print('FAIL',s['name'],repr(e))
              rows.append(dict(name=s['name'],status='fail',error=repr(e),tier=s['tier']))

          Path('v2_benchmark_results.json').write_text(json.dumps(rows,indent=2))
          print('\nSUMMARY_JSON')
          print(json.dumps(rows))
          PY
          python /tmp/v2_bench.py
      - uses: actions/upload-artifact@v4
        with:
          name: v2-alpha-benchmark-results
          path: v2_benchmark_results.json
