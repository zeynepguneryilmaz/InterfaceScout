name: InterfaceScout CI

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements-publication-lock.txt
      - name: Smoke test chemistry-only public workflow
        working-directory: backend
        run: |
          python - <<'PY'
          import urllib.request
          from app import app
          from v2.interface_engine import analyze_all_maps, analyze_interface_v2, PUBLIC_MAP_SPECS

          assert app.title == 'InterfaceScout'
          raw = urllib.request.urlopen('https://files.rcsb.org/download/1CRN.pdb', timeout=30).read().decode()

          out = analyze_all_maps(pdb_text=raw, chain='A', pH=7.4)
          assert out['method']['sasa_points_per_atom'] == 200
          assert out['method']['scrsa_threshold'] == 0.05
          assert out['method']['multiscale_radii_A'] == [6.0, 9.0]
          assert out['method']['patch_radius_A'] == 8.0
          assert out['method']['single_pass_all_maps'] is True
          assert out['n_maps'] == len(PUBLIC_MAP_SPECS) == 11
          required = {'anionic','cationic','hydrophobic','pi_carbon','hbond_donor','hbond_acceptor','oxide','calcium_phosphate','metal_coord','soft_metal_sulfur','phosphate'}
          assert required == set(out['maps'])
          assert 'surface_presets' not in out
          assert 'structural_context' not in out
          assert 'gnm_cutoff_A' not in out['method']
          assert 'rin_heavy_atom_cutoff_A' not in out['method']
          assert out['maps']['anionic']['n_patches'] > 0
          assert 'residues' in out['maps']['anionic']
          assert out['composite_policy']['validated_as_combined_model'] is False

          # Internal material wrapper remains only for frozen validation scripts.
          one = analyze_interface_v2(surface='silica', pdb_text=raw, chain='A', pH=7.4)
          assert one['input']['primary_chemistry'] == 'anionic'
          assert one['n_patches'] == out['maps']['anionic']['n_patches']
          print('InterfaceScout chemistry-only smoke test passed')
          PY
