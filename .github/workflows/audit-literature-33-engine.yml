name: Literature 33 InterfaceScout engine compatibility
on:
  push:
    paths:
      - 'validation/audit_literature_33_engine_20261122.py'
      - '.github/workflows/audit-literature-33-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and crystallography dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install gemmi==0.7.4 scipy==1.16.3
      - name: Test all 11 maps and fixed combined-map regional descriptors
        run: python -u validation/audit_literature_33_engine_20261122.py --shard ${{ matrix.shard }} --shards 6
      - name: Upload every PASS and failure record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: literature33-engine-shard-${{ matrix.shard }}
          path: literature33_engine/shard_${{ matrix.shard }}/
          retention-days: 90
