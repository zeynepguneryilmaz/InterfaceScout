name: Optional electrostatics unit tests
on:
  push:
    branches: [feature/physics-aware-electrostatics]
  pull_request:
    paths:
      - 'backend/optional_electrostatics.py'
      - 'tests/test_optional_electrostatics.py'
      - 'backend/app.py'
      - 'frontend/optional_electrostatics_ui.js'
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r backend/requirements.txt "httpx>=0.27,<0.30"
      - run: python -m unittest discover -s tests -p 'test_optional_electrostatics.py' -v
      - run: python -m unittest discover -s tests -p 'test_electrostatics_api.py' -v
      - run: node --check frontend/optional_electrostatics_ui.js
      - run: python -m py_compile backend/optional_electrostatics.py backend/app.py
