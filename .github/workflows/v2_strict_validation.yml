name: V2 strict validation
on:
  push:
    paths:
      - '.github/workflows/v2_strict_validation.yml'
      - 'backend/v2/protein_only.py'
      - 'backend/v2/rin.py'
      - 'backend/v2/gnm.py'
      - 'backend/v2/validation/evaluate_protein_only_ablation.py'
      - 'backend/v2/validation/benchmark_strict.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Run protein-only material-blind ablation
        run: PYTHONPATH=backend python backend/v2/validation/evaluate_protein_only_ablation.py
      - uses: actions/upload-artifact@v4
        with:
          name: protein-only-ablation
          path: protein_only_ablation.json
