name: V2 strict validation
on:
  push:
    paths:
      - '.github/workflows/v2_strict_validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Run extended strict experimental validation
        run: PYTHONPATH=backend python backend/v2/validation/evaluate_extended.py
      - uses: actions/upload-artifact@v4
        with:
          name: v2-extended-validation
          path: v2_extended_validation.json
