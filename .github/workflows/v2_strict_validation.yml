name: V2 strict validation
on:
  push:
    paths:
      - '.github/workflows/v2_strict_validation.yml'
      - 'backend/main.py'
      - 'backend/sitecustomize.py'
      - 'backend/v2/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTERFACESCOUT_VALIDATION_CANONICAL_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Run strict experimental validation
        run: PYTHONPATH=backend python backend/v2/validation/evaluate_strict.py
      - name: Run geometry-matched baselines
        run: PYTHONPATH=backend python backend/v2/validation/evaluate_matched_baselines.py
      - name: Run protein-only material-blind ablation
        run: PYTHONPATH=backend python backend/v2/validation/evaluate_protein_only_ablation.py
      - name: Run multi-structure robustness audit
        run: PYTHONPATH=backend python backend/v2/validation/evaluate_shape_robustness.py
      - name: Export representative 4F5U map
        run: PYTHONPATH=backend python backend/v2/validation/export_representative_case.py
      - uses: actions/upload-artifact@v4
        with:
          name: interfacescout-validation
          path: |
            v2_strict_validation.json
            matched_baselines.json
            protein_only_ablation.json
            shape_robustness.json
            representative_4F5U_anionic.json
