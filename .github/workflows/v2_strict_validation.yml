name: Publication benchmark validation
on:
  push:
    paths:
      - '.github/workflows/v2_strict_validation.yml'
      - 'backend/main.py'
      - 'backend/v2/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Run publication benchmark
        run: PYTHONPATH=backend python backend/v2/validation/evaluate_extended.py
      - name: Download benchmark PDB snapshots
        run: |
          mkdir -p PDB
          for id in 4F5S 2VUF 2CBA 2OED 1TGU 1SUV 3ECA 1JNJ 1CLL; do
            curl -fsSL "https://files.rcsb.org/download/${id}.pdb" -o "PDB/${id}.pdb"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: publication-benchmark-package
          path: |
            v2_extended_validation.json
            PDB/*.pdb
