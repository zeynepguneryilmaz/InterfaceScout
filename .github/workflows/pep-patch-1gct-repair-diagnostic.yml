name: PEP-Patch 1GCT missing backbone atom repair diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'validation/pep_patch_1GCT_repair_diagnostic.py'
      - '.github/workflows/pep-patch-1gct-repair-diagnostic.yml'
permissions:
  contents: read
jobs:
  audit-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install structure-preparation and real atom-repair dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "gemmi==0.7.4" "openmm==8.2.0" "pdbfixer @ git+https://github.com/openmm/pdbfixer.git@v1.11"
      - name: Repair missing atoms only and preserve original plus diagnostic structure
        run: python -u validation/pep_patch_1GCT_repair_diagnostic.py
      - name: Preserve source, repaired model and atomic audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ISV76-1GCT-Original-Versus-Repaired-Diagnostic
          path: pep_patch_1GCT_repair_diagnostic/
          if-no-files-found: warn
          retention-days: 90
