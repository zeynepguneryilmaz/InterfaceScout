name: InterfaceScout blinded experimental validation

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Benchmark manifest path under backend/v2/validation"
        required: true
        default: "benchmark_experimental_final.json"
  push:
    paths:
      - "backend/v2/validation/benchmark_experimental_final.json"
      - "backend/v2/validation/generate_experimental_predictions.py"
      - "backend/v2/validation/compare_experimental_predictions.py"
      - "backend/v2/model_settings.py"
      - ".github/workflows/experimental_validation_blinded.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r backend/requirements-publication-lock.txt
      - name: Resolve benchmark manifest
        id: manifest
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.manifest_path }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=benchmark_experimental_final.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate blinded predictions
        working-directory: backend
        env:
          INTERFACESCOUT_VALIDATION_CANONICAL_ONLY: "1"
        run: |
          python - <<'PY'
          from pathlib import Path
          from v2.validation.generate_experimental_predictions import main
          main(Path("v2/validation/${{ steps.manifest.outputs.name }}"))
          PY
      - name: Compare frozen predictions with experimental ground truth
        working-directory: backend
        env:
          INTERFACESCOUT_VALIDATION_CANONICAL_ONLY: "1"
        run: |
          python - <<'PY'
          from pathlib import Path
          from v2.validation.compare_experimental_predictions import main
          main(Path("v2/validation/${{ steps.manifest.outputs.name }}"))
          PY
      - name: Package outputs
        working-directory: backend
        run: |
          mkdir -p experimental_validation_package
          cp -r experimental_predictions experimental_validation_package/
          cp -r experimental_comparison experimental_validation_package/
          cp "v2/validation/${{ steps.manifest.outputs.name }}" experimental_validation_package/benchmark_manifest.json
          cp v2/model_settings.py experimental_validation_package/model_settings.py
          printf '%s\n' "Prediction stage was completed without experimental labels; comparison stage read labels only after prediction files were written." > experimental_validation_package/BLINDING_NOTE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: interfacescout-experimental-validation
          path: backend/experimental_validation_package
          if-no-files-found: error
