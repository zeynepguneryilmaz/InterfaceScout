name: InterfaceScout direct 48-protein numerical and radius decision
on:
  push:
    paths:
      - '.github/workflows/direct-convergence-radius-48.yml'
      - 'validation/direct_convergence_radius_48.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model and audit dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install gemmi==0.7.4 requests pandas
      - name: Compute direct SASA pairwise and 10 radius all-pair agreement
        run: python -u validation/direct_convergence_radius_48.py --shard ${{ matrix.shard }} --shards 4
      - name: Preserve all raw data, provenance and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-convergence-radius-shard-${{ matrix.shard }}
          path: parameter_decision_48/
          retention-days: 90
          if-no-files-found: error
  aggregate:
    runs-on: ubuntu-latest
    needs: calculate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model and aggregation dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install gemmi==0.7.4 requests pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: direct-convergence-radius-shard-*
          path: parameter_decision_48
          merge-multiple: true
      - name: Aggregate statistics with protein level bootstrap
        run: python -u validation/direct_convergence_radius_48.py --aggregate parameter_decision_48
      - name: Upload final decision data
        uses: actions/upload-artifact@v4
        with:
          name: direct-convergence-radius-complete
          path: parameter_decision_48/
          retention-days: 90
