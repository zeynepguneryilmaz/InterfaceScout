name: Large-panel 285 AlphaFold audit

on:
  push:
    branches:
      - large-panel-freeze-2026-10-13
    paths:
      - 'scripts/validation/audit_large_panel_alphafold.py'
      - '.github/workflows/large_panel_alphafold_audit.yml'
      - 'validation/large_panel_285_2026-10-13/source_285_master.csv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests
      - name: Audit 285 UniProt-linked AlphaFold DB models
        run: python scripts/validation/audit_large_panel_alphafold.py
      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: large-panel-285-alphafold-audit
          path: |
            validation/large_panel_285_2026-10-13/alphafold_structure_audit.csv
            validation/large_panel_285_2026-10-13/alphafold_structure_audit_summary.json
          if-no-files-found: error
