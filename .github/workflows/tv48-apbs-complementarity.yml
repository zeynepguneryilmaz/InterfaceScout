name: TV48 APBS complementary-information metrics
on:
  push:
    branches: [main]
    paths:
      - 'validation/tv48_apbs_complementarity_audit.py'
      - '.github/workflows/tv48-apbs-complementarity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install external APBS/PROPKA and statistical dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apbs
          python -m pip install -r backend/requirements.txt
          python -m pip install "pdb2pqr==3.7.1" "gemmi==0.7.4" "scipy==1.15.3" "pandas==2.2.3" "matplotlib==3.10.1"
          which apbs
          which pdb2pqr
      - name: Execute six real PDB/APBS analyses and matched map metrics
        run: python -u validation/tv48_apbs_complementarity_audit.py --shard ${{ matrix.shard }} --shards 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv48-apbs-metrics-shard-${{ matrix.shard }}
          path: tv48_apbs_metrics/
          if-no-files-found: warn
          retention-days: 90
  aggregate:
    needs: panel
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "gemmi==0.7.4" "scipy==1.15.3" "pandas==2.2.3" "matplotlib==3.10.1"
      - uses: actions/download-artifact@v4
        with:
          pattern: tv48-apbs-metrics-shard-*
          path: tv48_apbs_metrics
          merge-multiple: true
      - name: Aggregate scientific tests and generate plots
        run: python -u validation/tv48_apbs_complementarity_audit.py --aggregate --shards 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TV48-APBS-11Map-Metrics-and-Figures
          path: tv48_apbs_metrics/
          if-no-files-found: warn
          retention-days: 90
