name: Reanalyze real external 2025 silica-oligomer MD trajectories against frozen IS
on:
  push:
    branches: [md-zenodo-trajectory-inventory-2026-11-18]
permissions:
  contents: read
  actions: read
jobs:
  md-occupancy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        system: [ubq, sumo, lysozyme, gfp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install trajectory reader and computational libraries
        run: python -m pip install -q remotezip mdtraj biopython scipy numpy
      - name: Reuse original fully frozen IS source inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p frozen_source_maps
          gh run download 44283488773 -n frozen-IS-source-matched-PDBs-multimaterial -D frozen_source_maps
          test -f frozen_source_maps/1UBQ_A_frozen_all_channels.json
          test -f frozen_source_maps/256L_A_frozen_all_channels.json
      - name: Compute residue-level protein-silica MD contact occupancy with exact patch-null
        env:
          SYSTEM: ${{ matrix.system }}
        shell: bash
        run: |
          cat > compute_external_md.py <<'PY'
          import os,json,csv,itertools,traceback
          import numpy as np,mdtraj as md
          from pathlib import Path
          from remotezip import RemoteZip
          from scipy.spatial import cKDTree
          from Bio.Align import PairwiseAligner
          from Bio.SeqUtils import seq1
          SYS=os.environ['SYSTEM']
          entries={'ubq':('1UBQ_A','protmol_cat_fit_cent.xtc','protmol.gro'),
           'sumo':('1A5R_A','protmol_cat_fit_cent.xtc','protmol.gro'),
           'lysozyme':('256L_A','protmol_cat_fit_cent.xtc','protmol.gro'),
           'gfp':('2Y0G_A','fit_cent_rotate.xtc','protmol.gro')}
          pdb,xtc,gro=entries[SYS]
          out=Path('md_contact_reanalysis');out.mkdir(exist_ok=True)
          url='https://zenodo.org/api/records/14982466/files/zenodo.zip/content'
          base=f'zenodo/{SYS}/oligomeric/'
          def analyse():
           with RemoteZip(url,initial_buffer_size=1048576) as rz:
            for fn in (gro,xtc):
             print('FETCH',SYS,base+fn,flush=True)
             data=rz.read(base+fn)
             (out/fn).write_bytes(data)
             print('RECEIVED',fn,len(data),flush=True)
           orig=json.loads(Path(f'frozen_source_maps/{pdb}_frozen_all_channels.json').read_text())
           pdb_txt=Path(f'frozen_source_maps/{pdb}.pdb').read_text()
           reference={}
           for l in pdb_txt.splitlines():
            if l.startswith('ATOM  ') and l[12:16].strip()=='CA':
             reference[f'{l[21]}:{l[22:26].strip()}:{l[26].strip()}']=seq1(l[17:20],custom_map={'HIE':'H','HID':'H','CRO':'X'})
           keys=list(reference);seq=''.join(reference.values())
           top=md.load(str(out/gro)).topology
           valid=set('ALA ARG ASN ASP CYS GLN GLU GLY HIS HIE HID ILE LEU LYS MET PHE PRO SER THR TRP TYR VAL CRO'.split())
           protres=[r for r in top.residues if r.name in valid]
           resseq=''.join(seq1(r.name,custom_map={'HIE':'H','HID':'H','CRO':'X'}) for r in protres)
           aligner=PairwiseAligner();aligner.mode='global';aligner.match_score=2;aligner.mismatch_score=-3;aligner.open_gap_score=-7;aligner.extend_gap_score=-1
           ali=aligner.align(seq,resseq)[0]
           mapping={}
           for (a,b),(c,d) in zip(*ali.aligned):
            for i,j in zip(range(a,b),range(c,d)):
             if seq[i]==resseq[j]:mapping[protres[j].index]=keys[i]
           protein=[a.index for a in top.atoms if a.residue.name in valid and a.element and a.element.symbol!='H']
           silica=[a.index for a in top.atoms if a.residue.name in {'MON','DIM','TRI'} and a.element and a.element.symbol!='H']
           qc={'system':SYS,'PDB':pdb,'pdb_residues':len(seq),'md_residues':len(resseq),'mapped':len(mapping),'mapped_fraction':len(mapping)/len(seq),'protein_heavy_atom_count':len(protein),'silica_heavy_atom_count':len(silica),'archive_doi':'10.5281/zenodo.14982466'}
           print('QC',json.dumps(qc),flush=True)
           if qc['mapped_fraction']<0.85 or not silica:raise ValueError('Bad structural mapping or missing silica')
           resind=np.array([a.residue.index for a in top.atoms],dtype=np.int32)[protein]
           cutoffs=(0.4,0.5)
           count={c:{i:0 for i in mapping} for c in cutoffs}
           n=0;times=[];stride=20
           for chunk in md.iterload(str(out/xtc),top=str(out/gro),chunk=20,stride=stride):
            for j in range(chunk.n_frames):
             p=chunk.xyz[j,protein,:];s=chunk.xyz[j,silica,:]
             box=chunk.unitcell_lengths[j] if chunk.unitcell_lengths is not None else None
             if box is not None and np.all(box>0):
              bs=np.asarray(box);tree=cKDTree(np.mod(s,bs),boxsize=bs);p=np.mod(p,bs)
             else:tree=cKDTree(s)
             dist,_=tree.query(p,k=1,distance_upper_bound=0.5)
             for cutoff in cutoffs:
              indices=np.unique(resind[dist<cutoff])
              for idx in indices:
               if int(idx) in count[cutoff]:count[cutoff][int(idx)]+=1
             n+=1
            if chunk.time is not None:times.extend([float(x) for x in chunk.time])
            if n%400==0:print('PROGRESS',SYS,n,flush=True)
           if not n:raise ValueError('No frames')
           print('FRAMES',SYS,n,'time',min(times) if times else None,max(times) if times else None,flush=True)
           exposed=set(orig['exposed']);resrows=[];results=[]
           for cutoff in cutoffs:
            occ={mapping[i]:float(v)/n for i,v in count[cutoff].items()}
            for key,val in occ.items():resrows.append({'system':SYS,'PDB':pdb,'residue':key,'distance_nm':cutoff,'frame_occupancy':val,'IS_exposed':int(key in exposed)})
            total=sum(v for key,v in occ.items() if key in exposed)
            for chem in ['hbond_acceptor','hydrophobic']:
             patches=[set(x['members']) for x in orig['maps'][chem]]
             for k in [1,3,5]:
              selected=set().union(*patches[:k]);size=len(selected)
              observed=sum(occ.get(x,0) for x in selected)
              null=[]
              for ci in itertools.combinations(range(len(patches)),k):
               candidate=set().union(*(patches[x] for x in ci))
               if abs(len(candidate)-size)<=max(2,round(size*0.1)):
                null.append(sum(occ.get(x,0) for x in candidate))
              pval=sum(v>=observed-1e-10 for v in null)/len(null) if null else None
              truecontacts={key for key,v in occ.items() if v>=0.1 and key in exposed}
              hits=len(selected&truecontacts)
              rr={'system':SYS,'PDB':pdb,'cutoff_nm':cutoff,'chemistry':chem,'top_k':k,'selected_n':size,'accessible_n':len(exposed),'coverage':size/len(exposed),'contact_occupancy_total':total,'occupancy_captured':observed,'weighted_recall':observed/total if total else None,'10pct_contacts_n':len(truecontacts),'hits_10pct':hits,'null_n':len(null),'null_avg_occupancy':sum(null)/len(null) if null else None,'nominal_p':pval,'n_frames':n,'stride':stride,'simulation_start_ps':min(times) if times else None,'simulation_end_ps':max(times) if times else None,'mapping_fraction':qc['mapped_fraction']}
              results.append(rr);print('RESULT',SYS,cutoff,chem,k,'weighted_recall',rr['weighted_recall'],'p',pval,'n_frames',n,flush=True)
           with (out/'per_residue_occupancy.csv').open('w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(resrows[0]));w.writeheader();w.writerows(resrows)
           with (out/'benchmark_results.csv').open('w',newline='') as f:
            w=csv.DictWriter(f,fieldnames=list(results[0]));w.writeheader();w.writerows(results)
           (out/'quality_control.json').write_text(json.dumps(qc,indent=2))
          try:analyse()
          except Exception:
           (out/'ERROR.txt').write_text(traceback.format_exc());print(traceback.format_exc(),flush=True);raise
          finally:
           for fn in (xtc,gro):
            p=out/fn
            if p.exists():p.unlink()
          
          PY
          python -u compute_external_md.py | tee run_${SYSTEM}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-silica-MD-occupancy-${{ matrix.system }}
          path: |
            md_contact_reanalysis/*.csv
            md_contact_reanalysis/*.json
            md_contact_reanalysis/*.txt
            run_*.log
          retention-days: 30
