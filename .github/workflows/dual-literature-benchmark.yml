name: InterfaceScout paired nine-condition literature benchmark
on:
  push:
    paths:
      - 'validation/dual_literature_benchmark.py'
      - '.github/workflows/dual-literature-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install gemmi==0.7.4 pandas requests
      - run: python -u validation/dual_literature_benchmark.py --shard ${{ matrix.shard }} --shards 3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: literature-paired-shard-${{ matrix.shard }}
          path: dual_literature_benchmark/
          retention-days: 90
  aggregate:
    needs: compute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install gemmi==0.7.4 pandas requests
      - uses: actions/download-artifact@v4
        with:
          pattern: literature-paired-shard-*
          path: dual_literature_benchmark
          merge-multiple: true
      - run: python validation/dual_literature_benchmark.py --aggregate dual_literature_benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: dual-literature-benchmark-complete
          path: dual_literature_benchmark/
          retention-days: 90
