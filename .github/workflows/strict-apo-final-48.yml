name: Final residue QA and all 11 InterfaceScout maps on clean 48
on:
  push:
    paths:
      - .github/workflows/strict-apo-final-48.yml
      - validation/strict_apo_48_selected_candidates_v2_final.csv
      - validation/strict_apo_residue_48.py
      - validation/strict_apo_compat_48.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  final_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned InterfaceScout, Gemmi, and requests
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install gemmi==0.7.4 requests
      - name: Residue numbering, sequence labels, internal gaps, atom completeness and assembly hashes
        run: python -u validation/strict_apo_residue_48.py
      - name: Run InterfaceScout on all 48 full biological assemblies with 11 maps
        if: always()
        run: python -u validation/strict_apo_compat_48.py
      - name: Upload all 48 structure science and execution results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-strict-apo-48-qa
          path: |
            strict_apo_final_qa/*.json
            strict_apo_final_qa/*.csv
            strict_apo_panel_48/compatibility_48.json
            strict_apo_panel_48/compatibility_48.csv
          if-no-files-found: warn
