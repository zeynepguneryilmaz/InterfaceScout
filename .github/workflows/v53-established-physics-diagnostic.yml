name: v5.3 established physics diagnostic

on:
  push:
    branches:
      - development/v5.3-established-physics
    paths:
      - 'backend/physics_refinement.py'
      - 'backend/v53_app.py'
      - 'validation/run_v53_established_physics_diagnostic.py'
      - '.github/workflows/v53-established-physics-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi pydantic numpy biopython uvicorn
      - name: Run diagnostic
        run: python validation/run_v53_established_physics_diagnostic.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: interfacescout-v53-established-physics-diagnostic
          path: validation/v53_established_physics_diagnostic.json
