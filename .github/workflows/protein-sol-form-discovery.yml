name: Protein-sol public form discovery (no submissions)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'validation/protein_sol_form_discovery.py'
      - '.github/workflows/protein-sol-form-discovery.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only HTTP/HTML parser
        run: python -m pip install "requests==2.32.3" "beautifulsoup4==4.12.3"
      - name: Read public Protein-sol form (do not upload any structure)
        run: python -u validation/protein_sol_form_discovery.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Protein-sol-public-form-discovery
          path: external_protein_sol/
          retention-days: 30
          if-no-files-found: warn
