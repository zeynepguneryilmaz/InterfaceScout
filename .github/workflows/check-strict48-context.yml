name: Check chemical context of strict 48 protein structures
on:
  push:
    paths:
      - .github/workflows/check-strict48-context.yml
      - validation/strict_context_48.py
      - validation/strict_48_selected_candidates_v1.csv
  workflow_dispatch:
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install context inspection dependencies
        run: python -m pip install requests gemmi==0.7.4
      - name: Inspect full biological assemblies
        run: python -u validation/strict_context_48.py
      - name: Upload context report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-48-context-inspection
          path: |
            strict_context_48/*.csv
            strict_context_48/*.json
