name: Frozen 48 electrostatics rerun (experimental)
on:
  push:
    branches: [feature/physics-aware-electrostatics]
    paths:
      - 'backend/physics_surface.py'
      - 'backend/physics_aware_11maps.py'
      - 'backend/optional_electrostatics.py'
      - 'backend/core.py'
      - 'paper_validation/rerun_48_electrostatics.py'
      - '.github/workflows/physics-48-rerun.yml'
  workflow_dispatch:
    inputs:
      full_panel:
        description: 'After smoke, run all 48 frozen structures'
        required: true
        type: boolean
        default: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y apbs
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip install 'pdb2pqr==3.7.1' 'gemmi>=0.7,<0.9' 'scipy>=1.14,<1.18'
      - name: External tools and pure checks
        run: |
          command -v apbs
          command -v pdb2pqr || command -v pdb2pqr30
          python -m py_compile backend/physics_surface.py backend/physics_aware_11maps.py paper_validation/rerun_48_electrostatics.py
          python -m unittest discover -s tests -p 'test_optional_electrostatics.py' -v
      - name: Real small-structure APBS/PROPKA run
        run: python paper_validation/rerun_48_electrostatics.py --smoke --out physics_aware_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-aware-smoke
          path: physics_aware_smoke/
          retention-days: 30

  full-panel:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y apbs
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip install 'pdb2pqr==3.7.1' 'gemmi>=0.7,<0.9' 'scipy>=1.14,<1.18'
      - run: python paper_validation/rerun_48_electrostatics.py --shard ${{ matrix.shard }} --n-shards 6 --out physics_aware_rerun_48
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-aware-48-shard-${{ matrix.shard }}
          path: physics_aware_rerun_48/
          retention-days: 30
