name: InterfaceScout residue-level SASA bookkeeping validation
on:
  push:
    paths:
      - 'validation/independent_residue_sasa_qa.py'
      - '.github/workflows/residue-sasa-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python validation/independent_residue_sasa_qa.py
