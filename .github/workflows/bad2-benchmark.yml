name: BAD2 InterfaceScout benchmark

on:
  push:
    branches: [bad2-benchmark]
    paths:
      - 'benchmark/**'
      - '.github/workflows/bad2-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas matplotlib biopython
      - name: Check benchmark runner
        run: python -m py_compile benchmark/run_BAD2_fast.py
      - name: Run BAD 2.0 cross-protein fine tuning
        run: |
          mkdir -p benchmark/results_fast
          python benchmark/run_BAD2_fast.py --pdbdir benchmark/pdbs --outdir benchmark/results_fast | tee benchmark/results_fast/run.log
      - name: List outputs
        if: always()
        run: find benchmark/results_fast -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BAD2-finetuning-fast-results
          path: |
            benchmark/results_fast
            benchmark/run_BAD2_fast.py
            benchmark/BAD2_protein_panel.csv
          if-no-files-found: warn
