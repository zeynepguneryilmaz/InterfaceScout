name: InterfaceScout BSA manuscript outputs

on:
  push:
    paths:
      - 'backend/v2/validation/generate_bsa_manuscript_outputs.py'
      - '.github/workflows/bsa_manuscript_outputs.yml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install matplotlib
      - name: Generate BSA outputs
        env:
          PYTHONPATH: backend
          INTERFACESCOUT_VALIDATION_CANONICAL_ONLY: '1'
        run: python backend/v2/validation/generate_bsa_manuscript_outputs.py
      - name: Package
        run: zip -r InterfaceScout_BSA_Publication_Frozen_Outputs.zip bsa_manuscript_outputs
      - uses: actions/upload-artifact@v4
        with:
          name: interfacescout-bsa-publication-frozen-outputs
          path: InterfaceScout_BSA_Publication_Frozen_Outputs.zip
