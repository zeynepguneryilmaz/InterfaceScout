name: Protein-sol actual server response diagnostic (two PDBs)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protein-sol-two-case-diagnostic.yml'
permissions:
  contents: read
jobs:
  probe:
    name: Upload and inspect provider PDB results for 1UBQ and 1HEL
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install client and structure preparation dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "gemmi==0.7.4" "requests==2.32.3" "beautifulsoup4==4.12.3"
      - name: Execute TWO real server submissions and preserve HTML diagnostics
        run: |
          python -u validation/protein_sol_ISV76_full_batch.py --shard 0 --shards 1 --pdb-ids 1UBQ 1HEL
      - if: always()
        name: Retain original server responses and actual returned PDB files
        uses: actions/upload-artifact@v4
        with:
          name: Protein-sol-2-structure-actual-server-diagnostic
          path: protein_sol_ISV76/
          if-no-files-found: warn
          retention-days: 90
