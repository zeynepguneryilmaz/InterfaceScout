name: InterfaceScout 2.0 Harrison literature validation
on:
  push:
    branches: [validation/v2-literature-20260904]
    paths:
      - 'validation/literature_harrison_1pga.py'
      - '.github/workflows/v2-literature-harrison.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Verify frozen model code
        run: |
          python - <<'PY'
          import subprocess
          base='220d38be3027f124ff19b7a23cf27b04d1c29374'
          changed=subprocess.check_output(['git','diff','--name-only',base+'..HEAD'],text=True).splitlines()
          forbidden=[p for p in changed if p.startswith('backend/') or p.startswith('frontend/')]
          print('changed files:',changed)
          if forbidden:
              raise SystemExit('Validation branch modified frozen model code: '+', '.join(forbidden))
          PY
      - name: Run Harrison 1PGA literature consistency validation
        run: python validation/literature_harrison_1pga.py
      - uses: actions/upload-artifact@v4
        with:
          name: interfacescout-v2-harrison-literature-validation
          path: validation/literature_harrison_1pga_report.json
