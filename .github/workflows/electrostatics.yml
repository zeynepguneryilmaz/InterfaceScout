name: Optional APBS PROPKA integration

on:
  push:
    branches: [main]
    paths:
      - 'backend/electrostatics.py'
      - 'backend/interface_engine.py'
      - 'backend/app.py'
      - 'tests/test_electrostatics.py'
      - 'tests/electrostatics_integration_smoke.py'
      - '.github/workflows/electrostatics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-solvers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install APBS and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apbs
          python -m pip install -r backend/requirements.txt
          python -m pip install "pdb2pqr==3.7.1"
          which apbs
          which pdb2pqr
      - name: Run unit regressions
        run: python -m unittest tests/test_electrostatics.py -v
      - name: Verify actual external electrostatics on ubiquitin
        run: python tests/electrostatics_integration_smoke.py
