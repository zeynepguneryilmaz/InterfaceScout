name: V2 alpha benchmark parallel
on:
  push:
    paths:
      - '.github/workflows/v2_alpha_benchmark_parallel.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - 'BSA|4F5S|A|7.4|silica|anionic|ranges:196-383|B-domain'
          - 'HSA|2VUF|A|6.2|paa_fe3o4|anionic|ranges:373-389,403-410,414-428|AB-peptide'
          - 'HCAII63|2CBA|A|6.3|silica|anionic|exact:10|A-anchor'
          - 'HCAII83|2CBA|A|8.3|silica|anionic|exact:37|A-anchor'
          - 'GB3|2OED|A|7.4|citrate_au|anionic|exact:4,13,50|A-exact'
          - 'Ubiquitin|1UBQ|A|7.4|citrate_au|anionic|exact:2,15,18|A-csp'
          - 'Catalase|1TGU|ALL|7.4|polystyrene|hydrophobic|ranges:350-380|B-region'
          - 'Asparaginase|3ECA|ALL|7.5|aloh|cationic|ranges:250-310|B-region'
          - 'RNaseA|7RSA|A|7.0|silica|anionic|none|prediction'
          - 'Lysozyme|3LN2|A|7.0|silica|anionic|none|prediction'
          - 'beta2m|1JNJ|A|7.4|mpa_au|anionic|none|prediction'
          - 'AcP|2K7K|A|7.0|silica|anionic|ranges:22-33,55-66|B-approx'
          - 'Transferrin|1SUV|ALL|7.4|polystyrene|hydrophobic|ranges:140-160,480-500|B-region'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt scikit-learn
      - name: Run case
        env:
          CASE: ${{ matrix.case }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          import os,json
          import numpy as np
          from sklearn.metrics import roc_auc_score, average_precision_score
          import main as v1
          from v2.engine import analyze_v2
          parts=os.environ['CASE'].split('|')
          name,pdb,chain,ph,surface,v1chem,gt,tier=parts
          chain=None if chain=='ALL' else chain; ph=float(ph)
          exact=None; ranges=None
          if gt.startswith('exact:'): exact={int(x) for x in gt[6:].split(',')}
          elif gt.startswith('ranges:'): ranges=[tuple(map(int,x.split('-'))) for x in gt[7:].split(',')]
          def isgt(n): return (exact is not None and n in exact) or (ranges is not None and any(a<=n<=b for a,b in ranges))
          req=v1.AnalyzeRequest(pdb_id=pdb,chain=chain,env=v1.EnvParams(pH=ph,ionic=150,temp=298))
          r1=v1.analyze(req); c=r1['chemistries'][v1chem]
          rv2=analyze_v2(surface=surface,pdb_id=pdb,chain=chain,pH=ph,top_n=20)
          nums=[int(x['res_seq']) for x in r1['surface_residues']]
          v1map={int(x['res_seq']):float(x.get('multiscale_persistence',0)) for x in c.get('patch_centers',[])}
          v2map={int(x['res_seq']):float(x.get('score',0)) for x in rv2.get('patches',[])}
          v1top=[int(x['res_seq']) for x in sorted(c.get('patch_centers',[]),key=lambda z:z.get('multiscale_persistence',0),reverse=True)[:10]]
          v2top=[int(x['res_seq']) for x in rv2.get('top_patches',[])[:10]]
          out={'name':name,'pdb':pdb,'surface':surface,'ph':ph,'tier':tier,'v1_top10':v1top,'v2_top10':v2top,'v2_top3':v2top[:3]}
          if exact is not None or ranges is not None:
            y=np.array([int(isgt(n)) for n in nums]); s1=np.array([v1map.get(n,0) for n in nums]); s2=np.array([v2map.get(n,0) for n in nums])
            out['prevalence']=float(y.mean()); out['gt_surface_n']=int(y.sum())
            if 0<y.sum()<len(y):
              out['v1_auc']=float(roc_auc_score(y,s1)); out['v1_ap']=float(average_precision_score(y,s1)); out['v2_auc']=float(roc_auc_score(y,s2)); out['v2_ap']=float(average_precision_score(y,s2))
            gtset={n for n in nums if isgt(n)}
            out['v1_hit3']=len(gtset&set(v1top[:3])); out['v2_hit3']=len(gtset&set(v2top[:3])); out['v1_hit10']=len(gtset&set(v1top)); out['v2_hit10']=len(gtset&set(v2top))
          print('RESULT_JSON '+json.dumps(out,sort_keys=True))
          PY
