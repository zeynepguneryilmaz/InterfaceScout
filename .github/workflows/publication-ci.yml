name: Cross-platform publication CI

on:
  push:
    branches: [main, publication-hardening-2026-10-05]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Publication smoke tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax checks
        shell: bash
        run: |
          node --check frontend/decision_workflow.js
          node --check frontend/ensemble_ui.js
      - name: Frozen validation checks
        run: python validation/verify_publication.py
      - name: Unix launcher checks
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash run_local.sh --check
          bash start.sh --check
          bash start.command --check
      - name: Windows launcher checks
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call run_local.bat --check
          call start.bat --check

  browser-smoke:
    name: browser-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and Playwright
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
      - name: Install Linux Chromium system libraries
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - name: Actual UI and screenshot-backed ZIP cross-check
        run: python tests/browser_smoke.py

  large-structure-stress:
    name: large-structure-stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Real large protein and all-data ZIP/PDF/CSV stress
        run: python tests/stress_large_structure.py

  gapdh-tetramer-stress:
    name: gapdh-tetramer-stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Experimentally deposited 1U8F GAPDH monomer/tetramer 11-map and export stress
        run: python tests/stress_gapdh_tetramer.py

  first-install-smoke:
    name: first-install-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: First-time virtual environment setup, launcher, and HTTP API smoke
        run: python tests/first_launch_smoke.py

  browser-engine-compat:
    name: browser-engine-compat (${{ matrix.os }}, ${{ matrix.engine }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, engine: chromium, scope: full}
          - {os: macos-15, engine: firefox, scope: full}
          - {os: macos-15, engine: webkit, scope: single}
          - {os: ubuntu-24.04, engine: firefox, scope: full}
          - {os: ubuntu-24.04, engine: webkit, scope: full}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      IS_BROWSER: ${{ matrix.engine }}
      IS_TEST_SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package, Playwright and selected browser
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install playwright==1.55.0
          python -m playwright install ${{ matrix.engine }}
      - name: Install Linux browser system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: python -m playwright install-deps ${{ matrix.engine }}
      - name: Run real viewer map, screenshot PDF and multi-PDB ZIP test
        run: python tests/browser_smoke.py

  apple-silicon-qa:
    name: apple-silicon-native-qa
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert actual ARM64 architecture
        run: |
          python -c "import platform; assert platform.machine() == 'arm64', platform.platform(); print(platform.platform())"
      - name: First-time installation and application HTTP API
        run: python tests/first_launch_smoke.py
      - name: GAPDH 1332 residue tetramer and all PDF CSV B-factor exports
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python tests/stress_gapdh_tetramer.py
