name: Cross-platform publication CI

on:
  push:
    branches: [main, publication-hardening-2026-10-05]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Publication smoke tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: PDB B-factor exporter JavaScript regression tests
        run: node --test tests/test_bfactor_export.cjs
      - name: JavaScript syntax checks
        shell: bash
        run: |
          node --check frontend/decision_workflow.js
          node --check frontend/ensemble_ui.js
      - name: Frozen validation checks
        run: python validation/verify_publication.py
      - name: Unix launcher checks
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash run_local.sh --check
          bash start.sh --check
          bash start.command --check
      - name: Windows launcher checks
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call run_local.bat --check
          call start.bat --check

  full-numerical-reproduction:
    name: full-independent-231-map-reproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned calculation dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Recompute and independently check 21 inputs and all 231 maps
        run: python validation/reproduce.py --suite full --output validation-evidence/numerical
      - name: Preserve numerical report, output hashes and per-case data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interfacescout-v1.1.0-numerical-${{ github.sha }}
          path: validation-evidence/numerical/
          if-no-files-found: warn
          retention-days: 90

  browser-smoke:
    name: browser-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and Playwright
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
      - name: Install Linux Chromium system libraries
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - name: Actual UI and screenshot-backed ZIP cross-check
        env:
          INTERFACESCOUT_ARTIFACT_DIR: validation-evidence/browser
        run: python tests/browser_smoke.py
      - name: Preserve real browser ZIP exports and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interfacescout-v1.1.0-browser-${{ runner.os }}-${{ github.sha }}
          path: validation-evidence/browser/
          if-no-files-found: warn
          retention-days: 90

  large-structure-stress:
    name: large-structure-stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Real large protein and all-data ZIP/PDF/CSV stress
        run: python tests/stress_large_structure.py

  gapdh-tetramer-stress:
    name: gapdh-tetramer-stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Experimentally deposited 1U8F GAPDH monomer/tetramer 11-map and export stress
        run: python tests/stress_gapdh_tetramer.py

  first-install-smoke:
    name: first-install-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: First-time virtual environment setup, launcher, and HTTP API smoke
        run: python tests/first_launch_smoke.py


  publication-package:
    name: strict-publication-bundle
    needs: [test, browser-smoke, large-structure-stress, gapdh-tetramer-stress, first-install-smoke, full-numerical-reproduction]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: interfacescout-v1.1.0-numerical-${{ github.sha }}
          path: validation-evidence/numerical
      - uses: actions/download-artifact@v4
        with:
          name: interfacescout-v1.1.0-browser-Linux-${{ github.sha }}
          path: validation-evidence/browser/Linux
      - uses: actions/download-artifact@v4
        with:
          name: interfacescout-v1.1.0-browser-Windows-${{ github.sha }}
          path: validation-evidence/browser/Windows
      - uses: actions/download-artifact@v4
        with:
          name: interfacescout-v1.1.0-browser-macOS-${{ github.sha }}
          path: validation-evidence/browser/macOS
      - name: Check numerical/browser evidence and package tested source
        run: python publication/build_package.py --evidence-dir validation-evidence --output dist/InterfaceScout_v1.1.0_rc1_publication_bundle.zip
      - name: Keep the publication ZIP and its SHA-256 digest
        uses: actions/upload-artifact@v4
        with:
          name: InterfaceScout_v1.1.0_rc1_PUBLICATION_BUNDLE-${{ github.sha }}
          path: |
            dist/InterfaceScout_v1.1.0_rc1_publication_bundle.zip
            dist/InterfaceScout_v1.1.0_rc1_publication_bundle.zip.sha256
          if-no-files-found: error
          retention-days: 90
