name: NMR single-model validation
on:
  push:
    paths:
      - '.github/workflows/nmr_single_model_validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run first-model NMR structures
        run: |
          cat > /tmp/run_nmr.py <<'PY'
          import sys, json, urllib.request, tempfile
          from pathlib import Path
          from Bio.PDB import PDBParser, PDBIO, Select
          sys.path.insert(0, str(Path('backend').resolve()))
          import main as m

          class FirstModelSelect(Select):
              def accept_model(self, model):
                  return 1 if int(model.id)==0 else 0

          specs=[('GB3','2OED','A',7.4),('beta2-microglobulin','1JNJ','A',7.4),('Acylphosphatase','2K7K','A',7.0)]
          out=Path('nmr_single_model_outputs'); out.mkdir(exist_ok=True)
          for protein,pdb,chain,ph in specs:
              raw=out/f'{pdb}_raw.pdb'; urllib.request.urlretrieve(f'https://files.rcsb.org/download/{pdb}.pdb',raw)
              st=PDBParser(QUIET=True).get_structure(pdb,str(raw))
              one=out/f'{pdb}_model1.pdb'; io=PDBIO(); io.set_structure(st); io.save(str(one),FirstModelSelect())
              txt=one.read_text()
              req=m.AnalyzeRequest(pdb_text=txt,chain=chain,env=m.EnvParams(pH=ph,ionic=150.0,temp=298.0))
              r=m.analyze(req)
              (out/f'{protein}_{pdb}_pH{ph}.json').write_text(json.dumps(r,indent=2))
              print('RUN_OK',protein,pdb,'pH',ph,'surface',len(r.get('surface_residues',[])))
              for ck,cv in r.get('chemistries',{}).items():
                  rows=cv.get('residues',[])
                  top=sorted(rows,key=lambda x:x.get('multiscale_persistence',-1),reverse=True)[:10]
                  print('TOP10',protein,ck,[(x.get('res_name'),x.get('res_seq'),x.get('multiscale_persistence')) for x in top])
          PY
          python /tmp/run_nmr.py
      - uses: actions/upload-artifact@v4
        with:
          name: nmr-single-model-results
          path: nmr_single_model_outputs/
