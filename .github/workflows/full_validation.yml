name: Full external validation
on:
  push:
    paths:
      - '.github/workflows/full_validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pandas scikit-learn
      - name: Run 12-protein x all-chemistry analysis
        run: |
          cat > /tmp/run_full_validation.py <<'PY'
          import sys, json, traceback
          from pathlib import Path
          sys.path.insert(0, str(Path('backend').resolve()))
          import main as m

          specs = [
            ('BSA','4F5S','A',[7.0,7.4]),
            ('HSA','2VUF','A',[7.4]),
            ('HCAII','2CBA','A',[6.3,7.0,8.3]),
            ('GB3','2OED','A',[7.4]),
            ('Ubiquitin','1UBQ','A',[7.4]),
            ('Catalase','1TGU',None,[7.4]),
            ('L-asparaginase-II','3ECA',None,[7.4]),
            ('RNase-A','7RSA','A',[7.0]),
            ('Lysozyme','1LYZ','A',[7.0]),
            ('beta2-microglobulin','1JNJ','A',[7.4]),
            ('Acylphosphatase','2K7K','A',[7.0]),
            ('Transferrin','1SUV',None,[7.4]),
          ]
          out=Path('validation_outputs'); out.mkdir(exist_ok=True)
          index=[]
          first=True
          for protein,pdb,chain,phs in specs:
            for ph in phs:
              try:
                req=m.AnalyzeRequest(pdb_id=pdb, chain=chain, env=m.EnvParams(pH=ph, ionic=150.0, temp=298.0))
                r=m.analyze(req)
                fn=out/f'{protein}_{pdb}_pH{ph}.json'
                fn.write_text(json.dumps(r, indent=2))
                chems=r.get('chemistries',{})
                print(f'RUN_OK {protein} {pdb} pH={ph} chemistries={list(chems.keys())}')
                if first and chems:
                  ck=next(iter(chems)); cv=chems[ck]
                  print('SAMPLE_CHEM_KEYS',ck,list(cv.keys()) if isinstance(cv,dict) else type(cv))
                  if isinstance(cv,dict) and cv.get('residues'):
                    print('SAMPLE_RES_KEYS',list(cv['residues'][0].keys()))
                    print('SAMPLE_RES',cv['residues'][0])
                  first=False
                # generic top summary
                for ck,cv in chems.items():
                  rows=cv.get('residues',[]) if isinstance(cv,dict) else []
                  if not rows: continue
                  scorekeys=[k for k in rows[0] if 'persistence' in k.lower()]
                  if not scorekeys: scorekeys=[k for k in rows[0] if 'propensity' in k.lower()]
                  sk=scorekeys[0] if scorekeys else None
                  if sk:
                    rr=sorted(rows,key=lambda x:(x.get(sk) if isinstance(x.get(sk),(int,float)) else -1), reverse=True)[:10]
                    labels=[]
                    for x in rr:
                      rid=x.get('resid',x.get('residue_id',x.get('resseq',x.get('resnum','?'))))
                      rn=x.get('resname',x.get('aa',''))
                      labels.append(f'{rn}{rid}:{x.get(sk)}')
                    print(f'TOP10 {protein} {pdb} pH={ph} {ck} score={sk} ' + ','.join(labels))
                index.append({'protein':protein,'pdb':pdb,'chain':chain,'pH':ph,'status':'ok','file':str(fn)})
              except Exception as e:
                print(f'RUN_FAIL {protein} {pdb} pH={ph}: {type(e).__name__}: {e}')
                traceback.print_exc()
                index.append({'protein':protein,'pdb':pdb,'chain':chain,'pH':ph,'status':'fail','error':repr(e)})
          (out/'index.json').write_text(json.dumps(index,indent=2))
          PY
          python /tmp/run_full_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: full-validation-results
          path: validation_outputs/
