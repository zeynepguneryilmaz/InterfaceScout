name: Cancel obsolete platform release publishing run
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-obsolete-platform-release.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel only superseded automatic publication
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/45730217922/cancel" || true
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45730217922" --jq '.status + " " + (.conclusion // "pending")'
