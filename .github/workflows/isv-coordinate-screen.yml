name: ISV 68 mmCIF coordinate coverage screening
on:
  workflow_dispatch:
  push:
    paths:
      - 'validation/isv_coordinate_screen.py'
      - '.github/workflows/isv-coordinate-screen.yml'
permissions:
  contents: read
jobs:
  coordinates:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install gemmi==0.7.4
      - run: python -u validation/isv_coordinate_screen.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isv-68-coordinate-coverage
          path: isv_coordinate_screen/
          retention-days: 90
