name: Publish ZIP save and chemistry presets rc1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-zip-save-presets-rc1.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch full binary wheel closure for Windows CPython 3.10 3.11 3.12
        shell: bash
        run: |
          set -euo pipefail
          for minor in 10 11 12; do
            dest="wheelhouse/windows/py3.${minor}"
            mkdir -p "$dest"
            python -m pip download --disable-pip-version-check --only-binary=:all: --platform win_amd64 --implementation cp --python-version "3.${minor}" --abi "cp3${minor}" --dest "$dest" -r backend/requirements.txt
            # Cross-target pip download runs on Python 3.12 and can omit extras
            # guarded by python_version < 3.11, even when targeting cp310.
            if [ "$minor" = "10" ]; then
              python -m pip download --disable-pip-version-check --only-binary=:all: --platform win_amd64 --implementation cp --python-version 3.10 --abi cp310 --dest "$dest" 'exceptiongroup>=1.0.2'
            fi
            test "$(find "$dest" -maxdepth 1 -name '*.whl' | wc -l)" -ge 8
          done
      - name: Build Windows, macOS and Linux packages
        run: |
          set -euo pipefail
          python tools/build_release_archives.py --out dist --version v1.1.0-rc1
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          from zipfile import ZipFile
          import pathlib
          for platform in ("Windows", "macOS", "Linux"):
              p=pathlib.Path(f"dist/InterfaceScout-v1.1.0-rc1-{platform}-source.zip")
              with ZipFile(p) as z:
                  assert z.testzip() is None
                  names=z.namelist()
                  has_wheels=any(n.startswith("InterfaceScout/wheelhouse/windows/") for n in names)
                  assert has_wheels == (platform=="Windows"), platform
                  if platform=="Windows":
                      for py in ("3.10","3.11","3.12"):
                          assert any(n.startswith(f"InterfaceScout/wheelhouse/windows/py{py}/") and n.endswith(".whl") for n in names)
          for platform in ("Windows", "macOS", "Linux"):
              with ZipFile(f"dist/InterfaceScout-v1.1.0-rc1-{platform}-source.zip") as z:
                  names=set(z.namelist())
                  assert "InterfaceScout/frontend/workspace.css" in names
                  assert "InterfaceScout/frontend/workspace_ui.js" in names
              print(platform, "refined workspace verified")
          print("Windows offline wheels + other platform distributions verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rc1-offline-platform-packages
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  windows-offline-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.11','3.12']
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: rc1-offline-platform-packages
          path: dist
      - name: Extract published candidate package
        shell: pwsh
        run: |
          Expand-Archive -Path 'dist/InterfaceScout-v1.1.0-rc1-Windows-source.zip' -DestinationPath extracted -Force
          if (!(Test-Path extracted/InterfaceScout/wheelhouse/windows/py${{ matrix.python-version }})) { exit 1 }
      - name: Install ONLY from local wheels into clean isolated venv
        shell: pwsh
        run: |
          python -m venv extracted/InterfaceScout/backend/.venv
          & extracted/InterfaceScout/backend/.venv/Scripts/python.exe -m pip install --disable-pip-version-check --no-index --find-links "extracted/InterfaceScout/wheelhouse/windows/py${{ matrix.python-version }}" -r extracted/InterfaceScout/backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & extracted/InterfaceScout/backend/.venv/Scripts/python.exe extracted/InterfaceScout/backend/dependency_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prove Windows launcher installs without access to PyPI
        shell: pwsh
        run: |
          Remove-Item extracted/InterfaceScout/backend/.venv -Recurse -Force
          $env:PIP_NO_INDEX = "1"
          $env:PIP_INDEX_URL = "https://invalid.example.invalid/simple"
          cmd /c "cd /d extracted\\InterfaceScout && call run_local.bat --no-pause"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & extracted/InterfaceScout/backend/.venv/Scripts/python.exe extracted/InterfaceScout/backend/dependency_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test extracted app server and real 11-channel analysis
        shell: pwsh
        run: |
          & extracted/InterfaceScout/backend/.venv/Scripts/python.exe tests/verify_release_runtime.py extracted/InterfaceScout tests/fixtures/4AKE_A.pdb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  other-platform-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
          - os: macos-15-intel
            platform: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: rc1-offline-platform-packages
          path: dist
      - name: Extract and install corresponding archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('dist/InterfaceScout-v1.1.0-rc1-${{ matrix.platform }}-source.zip') as z:
              assert z.testzip() is None
              z.extractall('extracted')
          PY
          python -m pip install --disable-pip-version-check -r extracted/InterfaceScout/backend/requirements.txt
      - name: Test backend and 11-map analysis
        run: python tests/verify_release_runtime.py extracted/InterfaceScout tests/fixtures/4AKE_A.pdb

  browser-ux:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and real Chromium browser
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - name: Verify single compare and multi exports with all 11 maps and real screenshots
        run: python tests/browser_smoke.py

  publish:
    needs: [build, windows-offline-test, other-platform-test, browser-ux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rc1-offline-platform-packages
          path: dist
      - name: Update rc1 assets after all five native tests pass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f v1.1.0-rc1 "$GITHUB_SHA"
          git push --force origin refs/tags/v1.1.0-rc1:refs/tags/v1.1.0-rc1
          gh release upload v1.1.0-rc1 dist/*.zip --clobber
          mapfile -t a < <(gh release view v1.1.0-rc1 --json assets --jq '.assets[].name')
          test "${#a[@]}" -eq 3
          printf '%s\n' "${a[@]}"
