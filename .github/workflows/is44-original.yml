name: InterfaceScout 44 adsorption evidence panel frozen original 11 maps
on:
  push:
    branches: [is-44-adsorption-evidence-2026-11-19]
    paths:
      - 'analysis/is44_original_run.py'
      - '.github/workflows/is44-original.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen InterfaceScout backend
        run: python -m pip install -q -r backend/requirements.txt
      - name: Score source-matched protein structures across 11 chemistry channels
        run: python analysis/is44_original_run.py | tee is44_run.log
      - name: Publish provenance and per-protein Top-1-3-5 patch maps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: is44-original-eleven-chemistry-maps-2026-11-19
          path: |
            is44_output/
            is44_run.log
          retention-days: 60
