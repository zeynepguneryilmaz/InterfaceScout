name: InterfaceScout 2.0 explicit Harrison validation
on:
  push:
    branches: [validation/v2-explicit-harrison-20260904]
    paths:
      - 'backend/nonpolar_explicit.py'
      - 'backend/nonpolar_energy.py'
      - 'backend/requirements.txt'
      - 'validation/literature_harrison_1pga_explicit.py'
      - '.github/workflows/v2-explicit-harrison.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
      - name: Run explicit graphene Harrison validation
        run: python validation/literature_harrison_1pga_explicit.py
      - uses: actions/upload-artifact@v4
        with:
          name: interfacescout-v2-explicit-harrison
          path: validation/literature_harrison_1pga_explicit_report.json
