name: Capture actual README application screenshots
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/capture_real_readme_ui.py'
      - '.github/workflows/capture-real-readme-ui.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install playwright==1.55.0
          python -m playwright install chromium
          python -m playwright install-deps chromium
      - run: python tools/capture_real_readme_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InterfaceScout-actual-UI-three-workflows
          path: docs/figures/interfacescout-real-*.png
          if-no-files-found: warn
          retention-days: 90
      - name: Commit only verified real application screenshots
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/figures/interfacescout-real-single-protein.png docs/figures/interfacescout-real-compare-two.png docs/figures/interfacescout-real-multi-pdb.png
          if ! git diff --cached --quiet; then
            git commit -m "Add authentic screenshots for all three analysis modes"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
