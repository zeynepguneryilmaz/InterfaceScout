name: IS44 source DOI bibliography metadata
on:
  push:
    branches: [is-44-adsorption-evidence-2026-11-19]
    paths:
      - analysis/is44_crossref_metadata.py
      - .github/workflows/is44-crossref.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q requests
      - run: python analysis/is44_crossref_metadata.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: is44-source-bibliography
          path: is44_publication_metadata/
          retention-days: 30
