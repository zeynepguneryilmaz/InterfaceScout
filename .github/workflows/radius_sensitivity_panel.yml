name: InterfaceScout radius sensitivity
on:
  push:
    paths:
      - '.github/workflows/radius_sensitivity_panel.yml'
      - 'backend/main.py'
      - 'backend/sitecustomize.py'
      - 'backend/requirements-publication-lock.txt'
      - 'backend/v2/chemistry_freeze.py'
      - 'backend/v2/prepare.py'
      - 'backend/v2/validation/evaluate_radius_sensitivity_panel.py'
  workflow_dispatch:

jobs:
  radius-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTERFACESCOUT_VALIDATION_CANONICAL_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - run: pip install -r backend/requirements-publication-lock.txt
      - name: Run 14-protein radius-pair sensitivity panel
        run: PYTHONPATH=backend python backend/v2/validation/evaluate_radius_sensitivity_panel.py
      - uses: actions/upload-artifact@v4
        with:
          name: interfacescout-radius-sensitivity-panel
          path: radius_sensitivity_panel.json
