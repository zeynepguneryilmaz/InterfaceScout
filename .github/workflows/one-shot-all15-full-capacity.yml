name: One-shot all15 full-capacity scoring

on:
  push:
    branches: [validation-study]
    paths:
      - '.github/workflows/one-shot-all15-full-capacity.yml'

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation-study
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apbs
          pip install numpy pandas scipy biopython fastapi pydantic pdb2pqr
      - name: Run all15 full-capacity scoring
        run: python validation/run_all15_full_capacity.py
      - name: Commit results
        run: |
          git config user.name 'InterfaceScout validation bot'
          git config user.email 'validation@interfacescout.local'
          git add validation/packages/all15/results_full_capacity
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Add all15 full-capacity InterfaceScout scores'
            git push origin validation-study
          fi
