name: Method validation audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'validation/**'
      - '.github/workflows/method-validation.yml'
  push:
    branches: [validation-study]
    paths:
      - 'validation/**'
      - '.github/workflows/method-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation-study
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy biopython fastapi pydantic
      - name: Run method validation
        run: python validation/run_method_validation.py
      - name: Commit validation outputs
        if: github.event_name == 'push'
        run: |
          git config user.name 'InterfaceScout validation bot'
          git config user.email 'validation@interfacescout.local'
          git add validation/results
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Add method validation results'
            git push origin validation-study
          fi
      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: method-validation-results
          path: validation/results
