name: ISV76 1GCT and 8C50 focused scientific solver QA
on:
  push:
    branches: [main]
    paths:
      - 'validation/isv76_special_cases_QA.py'
      - '.github/workflows/isv76-special-cases-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific:
    name: Scientific diagnostic ${{ matrix.case_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        case_id: ["1GCT","8C50"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual APBS PDB2PQR and Gemmi
        run: |
          sudo apt-get update
          sudo apt-get install -y apbs
          python -m pip install -r backend/requirements.txt
          python -m pip install "pdb2pqr==3.7.1" "gemmi==0.7.4" "pandas==2.2.3" "matplotlib==3.10.1"
          which apbs
          which pdb2pqr
      - name: Real biochemical/structural boundary-case verification
        run: python -u validation/isv76_special_cases_QA.py --case ${{ matrix.case_id }}
      - name: Keep all actual solver comparisons structural provenance and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ISV76-special-${{ matrix.case_id }}
          path: isv76_special_cases/
          retention-days: 90
