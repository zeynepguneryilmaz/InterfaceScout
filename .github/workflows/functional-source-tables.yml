name: Source tables of independent protein material studies
on:
  push:
    branches: [independent-md-functional-2026-11-17]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch actual open fulltext XML and tabulated numeric values
        run: python validation/extract_functional_primary_tables.py
      - name: Export publication source tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interfacescout-primary-activity-and-md-source-tables
          path: validation/independent_md_functional/source_tables/
          retention-days: 90
