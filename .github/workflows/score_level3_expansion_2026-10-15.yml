name: Score prospective Level-3 expansion

on:
  push:
    branches:
      - level3-expansion-score-2026-10-15
    paths:
      - 'validation/level3_expansion_2026-10-10/score_prospective_level3.py'
      - '.github/workflows/score_level3_expansion_2026-10-15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: level3-expansion-score-2026-10-15
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Score frozen prospective Level-3 conditions
        run: python validation/level3_expansion_2026-10-10/score_prospective_level3.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/level3_expansion_2026-10-10/prospective_level3_results.csv
          git add validation/level3_expansion_2026-10-10/prospective_level3_summary.json
          if git diff --cached --quiet; then
            echo "No score changes to commit"
          else
            git commit -m "Score frozen prospective Level-3 conditions"
            git push origin HEAD:level3-expansion-score-2026-10-15
          fi
