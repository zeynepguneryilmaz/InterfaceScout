name: v5.2 structural validation

on:
  workflow_dispatch:
  push:
    branches:
      - development/v5.2-core-freeze
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'validation/run_v52_structural_validation.py'
      - 'validation/run_v52_ui_validation.py'
      - '.github/workflows/v52-structural-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi pydantic numpy biopython uvicorn
      - name: Run structural/regression validation
        run: python validation/run_v52_structural_validation.py
      - name: Run UI validation
        run: python validation/run_v52_ui_validation.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: interfacescout-v52-structural-validation
          path: |
            validation/v52_structural_validation_report.json
            validation/v52_ui_validation_report.json
