name: Generate manuscript examples
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt openpyxl
      - name: Smoke-test backend
        working-directory: backend
        run: |
          python - <<'PY'
          from app import app
          from interface_engine import analyze_all_maps
          r = analyze_all_maps(pdb_id='1UBQ', chain='A', pH=7.7, ionic_mM=150.0, temp_K=298.0)
          assert r['n_maps'] == 11
          assert r['maps']['anionic']['patches']
          print('Backend smoke test passed')
          PY
      - name: Generate examples
        run: python backend/generate_examples.py
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-examples
          path: examples/
          if-no-files-found: error
