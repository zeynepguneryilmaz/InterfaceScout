name: V2 GNM pilot
on:
  push:
    paths:
      - '.github/workflows/v2_gnm_pilot.yml'
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - 'GB3|2OED|A|7.4|anionic|exact:4,13,50'
          - 'HCAII63|2CBA|A|6.3|anionic|exact:10'
          - 'HCAII83|2CBA|A|8.3|anionic|exact:37'
          - 'HSA|2VUF|A|6.2|anionic|ranges:373-389,403-410,414-428'
          - 'AcP|2K7K|A|7.0|anionic|ranges:22-33,55-66'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - name: Run pilot case
        env:
          CASE: ${{ matrix.case }}
        run: |
          PYTHONPATH=backend python - <<'PY'
          import os, json
          from v2.dynamic_engine import analyze_v2_dynamic
          name,pdb,chain,ph,chem,gt=os.environ['CASE'].split('|')
          ph=float(ph)
          exact=None; ranges=None
          if gt.startswith('exact:'): exact={int(x) for x in gt[6:].split(',')}
          elif gt.startswith('ranges:'): ranges=[tuple(map(int,x.split('-'))) for x in gt[7:].split(',')]
          def isgt(n):
            return (exact is not None and n in exact) or (ranges is not None and any(a<=n<=b for a,b in ranges))
          r=analyze_v2_dynamic(chemistry=chem,pdb_id=pdb,chain=chain,pH=ph,top_n_anchors=10,gnm_cutoff_A=7.3,extension_radius_A=12.0,min_abs_corr=0.35,max_extensions=12)
          anchor_gt=[]; ext_gt=[]; ext_all=[]
          for a in r['dynamic_anchor_analysis']:
            if isgt(int(a.get('anchor_res_seq') or -999)): anchor_gt.append(a['anchor_key'])
            hits=[x for x in a.get('dynamic_extension',[]) if isgt(int(x['res_seq']))]
            if hits:
              ext_gt.append({'anchor':a['anchor_key'],'gt_hits':[x['key'] for x in hits], 'mean_abs_corr':a.get('mean_abs_corr_reported'), 'anchor_fluct':a.get('anchor_normalized_fluctuation')})
            ext_all.append({'anchor':a['anchor_key'],'extensions':[x['key'] for x in a.get('dynamic_extension',[])], 'fluct':a.get('anchor_normalized_fluctuation'),'degree':a.get('anchor_contact_degree')})
          print('PILOT_JSON '+json.dumps({'name':name,'pdb':pdb,'ph':ph,'gt':gt,'v1_anchor_gt_hits':anchor_gt,'dynamic_gt_hits':ext_gt,'anchors':ext_all},sort_keys=True))
          PY
