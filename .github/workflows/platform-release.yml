name: Build platform source distributions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for archive names (e.g. v1.1.0-preview)'
        required: true
        default: 'manual-preview'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build three platform archives
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: python tools/build_release_archives.py --version "$RELEASE_VERSION"
      - name: Upload archives as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InterfaceScout-platform-source-distributions
          path: dist/*.zip
          if-no-files-found: error
      - name: Attach archives to GitHub Release when triggered by a tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --clobber
          else
            gh release create "$tag" dist/*.zip --title "$tag" --generate-notes
          fi
