name: Audit Level 1 structure enrichment
on:
  push:
    branches:
      - benchmark-scoring-v1-2026-10-07
    paths:
      - 'validation/benchmark_v1_2026-10-06/run_level1_enrichment_only.py'
      - '.github/workflows/benchmark_enrichment_audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt scipy==1.16.2
      - run: python validation/benchmark_v1_2026-10-06/run_level1_enrichment_only.py
      - uses: actions/upload-artifact@v4
        with:
          name: interfacescout-level1-enrichment-audit
          path: validation/benchmark_v1_2026-10-06/scoring_v1_2026-10-07/
          retention-days: 90
