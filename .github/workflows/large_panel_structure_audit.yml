name: Large-panel 285 structure audit

on:
  push:
    branches:
      - large-panel-freeze-2026-10-13
    paths:
      - 'scripts/validation/audit_large_panel_structures.py'
      - '.github/workflows/large_panel_structure_audit.yml'
      - 'validation/large_panel_285_2026-10-13/source_285_master.csv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests
      - name: Run conservative UniProt/RCSB audit
        run: python scripts/validation/audit_large_panel_structures.py
      - name: Upload audit output
        uses: actions/upload-artifact@v4
        with:
          name: large-panel-285-structure-audit
          path: validation/large_panel_285_2026-10-13/structure_audit_auto.csv
          if-no-files-found: error
