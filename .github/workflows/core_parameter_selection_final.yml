name: InterfaceScout final parameter selection

on:
  push:
    paths:
      - 'backend/main.py'
      - 'backend/v2/model_settings.py'
      - 'backend/v2/chemistry_freeze.py'
      - 'backend/v2/validation/select_core_parameters_consensus.py'
      - 'backend/v2/validation/select_core_parameters_final.py'
      - '.github/workflows/core_parameter_selection_final.yml'
  workflow_dispatch:

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements-publication-lock.txt
      - name: Run adsorption-label-free parameter selection
        working-directory: backend
        run: python -m v2.validation.select_core_parameters_final
      - uses: actions/upload-artifact@v4
        with:
          name: interfacescout-final-parameter-selection
          path: |
            backend/core_parameter_selection_consensus.json
            backend/selection_pdbs
          if-no-files-found: error
