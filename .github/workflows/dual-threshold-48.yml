name: InterfaceScout 48 dual total-RSA threshold sensitivity
on:
  push:
    paths:
      - 'validation/dual_threshold_48.py'
      - '.github/workflows/dual-threshold-48.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install gemmi==0.7.4 pandas requests
      - run: python -u validation/dual_threshold_48.py --shard ${{ matrix.shard }} --shards 4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threshold-shard-${{ matrix.shard }}
          path: dual_threshold_48/
          retention-days: 90
  aggregate:
    needs: compute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install gemmi==0.7.4 pandas requests
      - uses: actions/download-artifact@v4
        with:
          pattern: threshold-shard-*
          path: dual_threshold_48
          merge-multiple: true
      - run: python validation/dual_threshold_48.py --aggregate dual_threshold_48
      - uses: actions/upload-artifact@v4
        with:
          name: dual-threshold-48-complete
          path: dual_threshold_48/
          retention-days: 90
