name: InterfaceScout electrostatic steering diagnostic

on:
  push:
    branches:
      - development/v5.2-electrostatic-steering
  workflow_dispatch:

jobs:
  steering-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run steering diagnostic
        run: python validation/run_steering_diagnostic.py
      - name: Run orientation-null diagnostic
        run: python validation/run_steering_orientation_null.py
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: interfacescout-steering-diagnostic
          path: validation_results/
