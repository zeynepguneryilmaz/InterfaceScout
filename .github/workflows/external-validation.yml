name: InterfaceScout v5.2 geometry diagnostic

on:
  push:
    branches:
      - validation/interfacescout-external-benchmark-20260903
  workflow_dispatch:

jobs:
  v52-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt scikit-learn
      - name: Run v5.2 side-chain geometry diagnostic
        run: python validation/run_v52_geometry_diagnostic.py
      - name: Upload v5.2 diagnostic outputs
        uses: actions/upload-artifact@v4
        with:
          name: interfacescout-v52-geometry-diagnostic
          path: validation_results/
