name: InterfaceScout geometry audit

on:
  push:
    branches:
      - validation/interfacescout-external-benchmark-20260903
  workflow_dispatch:

jobs:
  geometry-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt scipy
      - name: Run adsorption-independent geometry audit
        run: python validation/run_geometry_audit.py
      - name: Upload geometry audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: interfacescout-geometry-audit
          path: validation_results/
