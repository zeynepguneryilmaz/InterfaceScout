name: InterfaceScout external validation

on:
  push:
    branches:
      - validation/interfacescout-external-benchmark-20260903
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt scipy scikit-learn
      - name: Run frozen-v5.1 validation
        run: python validation/run_external_benchmark.py
      - name: Run extended established-metric and sensitivity checks
        run: python validation/run_extended_checks.py
      - name: Upload validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: interfacescout-external-validation
          path: validation_results/
