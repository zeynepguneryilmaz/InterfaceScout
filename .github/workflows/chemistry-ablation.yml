name: Chemistry-off ablation audit
on:
  push:
    branches: [benchmark-chemistry-ablation-2026-11-16]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt
      - run: python validation/run_chemistry_ablation.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interfacescout-chemistry-ablation
          path: validation/chemistry_ablation_results/
          retention-days: 30
