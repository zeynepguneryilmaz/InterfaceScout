name: InterfaceScout 2.0 metric validation
on:
  push:
    branches: [development/v2.0.0]
    paths:
      - 'validation/metrics.py'
      - 'validation/metric_validation.py'
      - '.github/workflows/v2-metric-validation.yml'
  workflow_dispatch:
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scikit-learn
      - run: python validation/metric_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: interfacescout-v2-metric-validation
          path: validation/metric_validation_report.json
