name: ISV76 PEP-Patch targeted failed-case repeat (long runtime)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'validation/external_methods_full_panel.py'
      - '.github/workflows/pep-patch-failed-five-retry.yml'
permissions:
  contents: read
jobs:
  retry:
    name: PEP-Patch retry ${{ matrix.pdb }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pdb: [6TAV, 2FHA, 1HC1, 1IGT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original pinned PEP-Patch and APBS, no competitor code modifications
        run: |
          sudo apt-get update
          sudo apt-get install -y apbs git
          python -m pip install -r backend/requirements.txt
          python -m pip install "gemmi==0.7.4" "psutil==6.1.1"
          python -m venv /opt/pep-venv
          /opt/pep-venv/bin/pip install --upgrade pip
          /opt/pep-venv/bin/pip install "numpy<2" "mdtraj" "psutil"
          /opt/pep-venv/bin/pip install "git+https://github.com/liedllab/surface_analyses.git@162a7c822acdedc9f281a7cc68efe88d8e33928f"
          /opt/pep-venv/bin/pep_patch_electrostatic --help
      - name: Rerun original PEP-Patch with 900s per-method limit and retain actual scientific failures
        run: python -u validation/external_methods_full_panel.py --tool pep_patch --shard 0 --shards 1 --retry-pdbs ${{ matrix.pdb }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PEP-Patch-Retry-${{ matrix.pdb }}
          path: external_methods_full_panel/
          retention-days: 90
          if-no-files-found: warn
