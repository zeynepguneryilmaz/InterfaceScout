name: One-shot master ablation report

on:
  push:
    branches: [validation-study]
    paths:
      - '.github/workflows/one-shot-master-ablation.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation-study
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas tabulate
      - name: Build master ablation report
        run: python validation/build_master_ablation_report.py
      - name: Commit report
        run: |
          git config user.name 'InterfaceScout validation bot'
          git config user.email 'validation@interfacescout.local'
          git add validation/packages/all15/master_ablation
          if git diff --cached --quiet; then
            echo 'No report changes'
          else
            git commit -m 'Add master InterfaceScout ablation report'
            git push origin validation-study
          fi
