name: ISV80 protein sequence redundancy audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'validation/isv_sequence_overlap.py'
      - '.github/workflows/isv-sequence-overlap.yml'
permissions:
  contents: read
jobs:
  sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install biopython
      - run: python -u validation/isv_sequence_overlap.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isv80-sequence-vs-tv48-audit
          path: isv_sequence_similarity/
          retention-days: 90
