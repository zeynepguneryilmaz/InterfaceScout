name: Audit legacy rc1 archive contents

on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-legacy-rc1.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare legacy archive against slim platform distribution
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_release_archives.py --out dist --version v1.1.0-rc1
          mkdir -p audit
          gh release download v1.1.0-rc1 --pattern 'InterfaceScout_v1.1.0_rc1_publication_bundle.zip' --dir audit
          python - <<'PY'
          import zipfile, pathlib, json
          legacy=pathlib.Path('audit/InterfaceScout_v1.1.0_rc1_publication_bundle.zip')
          standard=pathlib.Path('dist/InterfaceScout-v1.1.0-rc1-Windows-source.zip')
          with zipfile.ZipFile(legacy) as z:
              old={x.filename:x.file_size for x in z.infolist() if not x.is_dir()}
          with zipfile.ZipFile(standard) as z:
              new={x.filename:x.file_size for x in z.infolist() if not x.is_dir()}
          only_old={k:v for k,v in old.items() if k not in new}
          print('LEGACY TOTAL FILES',len(old),'uncompressed MB',round(sum(old.values())/1e6,2))
          print('PLATFORM FILES',len(new),'uncompressed MB',round(sum(new.values())/1e6,2))
          print('LEGACY UNIQUE PATHS',len(only_old),'uncompressed MB',round(sum(only_old.values())/1e6,2))
          for k,v in sorted(only_old.items(),key=lambda a:-a[1])[:80]:
              print('LEGACY_ONLY',v,k)
          pathlib.Path('audit/inventory.json').write_text(json.dumps({
              'legacy_file_count':len(old),'new_file_count':len(new),
              'legacy_only':only_old
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-rc1-inventory
          path: audit/inventory.json
