name: Consolidate research folders
on:
  push:
    branches: [main]
    paths: ['.github/workflows/research-reorganization.yml']
permissions:
  contents: write
jobs:
  reorganize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reorganize and verify archive integrity and links
        run: python tools/reorganize_research.py
      - name: Install application dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify application tests
        run: python -m unittest discover -s tests -q
      - name: Commit verified organization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Organize research into method verification and protein surface analysis"
          git push origin HEAD:main
