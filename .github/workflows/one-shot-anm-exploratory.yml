name: One-shot ANM exploratory validation

on:
  push:
    branches: [validation-study]
    paths:
      - '.github/workflows/one-shot-anm-exploratory.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation-study
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy biopython fastapi pydantic
      - name: Run ANM exploratory batch
        run: python validation/run_anm_ensemble_exploratory.py
      - name: Commit results
        run: |
          git config user.name 'InterfaceScout validation bot'
          git config user.email 'validation@interfacescout.local'
          git add validation/packages/all15/results_anm_exploratory
          if git diff --cached --quiet; then
            echo 'No result changes'
          else
            git commit -m 'Add exploratory ANM ensemble validation results'
            git push origin validation-study
          fi
