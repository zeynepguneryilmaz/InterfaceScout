name: One-shot summarize curated v2
on:
  push:
    branches: [validation-study]
    paths: ['.github/workflows/one-shot-summarize-curated-v2.yml']
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation-study
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python validation/summarize_curated_v2.py
      - run: |
          git config user.name 'InterfaceScout validation bot'
          git config user.email 'validation@interfacescout.local'
          git add validation/packages/all15/results_curated_validation_v2/decision_summary
          git commit -m 'Add curated v2 model decision summary' || exit 0
          git pull --rebase origin validation-study
          git push origin validation-study
