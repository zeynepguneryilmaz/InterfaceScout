name: TV48 APBS solvent-accessible shell and grid sensitivity
on:
  push:
    branches: [main]
    paths:
      - 'validation/tv48_apbs_sas_grid_audit.py'
      - '.github/workflows/tv48-apbs-sas-grid.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real solvers and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apbs
          python -m pip install -r backend/requirements.txt
          python -m pip install "pdb2pqr==3.7.1" "gemmi==0.7.4" "scipy==1.15.3" "pandas==2.2.3" "matplotlib==3.10.1"
          which apbs
          which pdb2pqr
      - name: Execute actual APBS and SAS shell sampling (six TV48 structures)
        run: python -u validation/tv48_apbs_sas_grid_audit.py --panel-shard ${{ matrix.shard }} --shards 8
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv48-apbs-sas-panel-${{ matrix.shard }}
          path: tv48_apbs_sas/
          retention-days: 90
          if-no-files-found: warn

  sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real solvers and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apbs
          python -m pip install -r backend/requirements.txt
          python -m pip install "pdb2pqr==3.7.1" "gemmi==0.7.4" "scipy==1.15.3" "pandas==2.2.3" "matplotlib==3.10.1"
          which apbs
          which pdb2pqr
      - name: Sensitivity of actual APBS grid, pH and ionic conditions
        run: python -u validation/tv48_apbs_sas_grid_audit.py --sensitivity-shard ${{ matrix.shard }} --shards 8
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv48-apbs-sas-sensitivity-${{ matrix.shard }}
          path: tv48_apbs_sas/
          retention-days: 90
          if-no-files-found: warn

  aggregate:
    if: always()
    needs: [panel, sensitivity]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "gemmi==0.7.4" "scipy==1.15.3" "pandas==2.2.3" "matplotlib==3.10.1"
      - uses: actions/download-artifact@v4
        with:
          pattern: tv48-apbs-sas-*
          path: tv48_apbs_sas
          merge-multiple: true
      - name: Audit completeness and render data-derived figures
        run: python -u validation/tv48_apbs_sas_grid_audit.py --aggregate --shards 8
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TV48-APBS-SAS-Grid-pH-Ionic-Sensitivity-Results
          path: tv48_apbs_sas/
          retention-days: 90
          if-no-files-found: warn
