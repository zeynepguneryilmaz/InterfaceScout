name: Refresh v1.1.0-rc1 after verified cleanup merge

on:
  workflow_run:
    workflows: ["Cross-platform publication CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  update-rc1:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exactly the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Only update rc1 for its explicitly requested cleanup merge
        id: guard
        shell: bash
        run: |
          subject="$(git log -1 --format=%s HEAD)"
          if [ "$subject" = "Release: refresh v1.1.0-rc1 platform packages" ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
            echo "This is not the one-off rc1 cleanup merge; skipping."
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.apply == 'true'
        with:
          python-version: '3.12'
      - name: Build three OS archives plus complete bundle
        if: steps.guard.outputs.apply == 'true'
        run: python tools/build_release_archives.py --version v1.1.0-rc1
      - name: Verify generated archive inputs and checksum manifest
        if: steps.guard.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/InterfaceScout-v1.1.0-rc1-Windows-source.zip
          test -s dist/InterfaceScout-v1.1.0-rc1-macOS-source.zip
          test -s dist/InterfaceScout-v1.1.0-rc1-Linux-source.zip
          test -s dist/InterfaceScout_v1_1_0_rc1_publication_bundle.zip
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          from pathlib import Path
          import zipfile
          files = list(Path('dist').glob('*.zip'))
          assert len(files) == 4, files
          for archive in files:
              with zipfile.ZipFile(archive) as z:
                  assert z.testzip() is None, archive
                  names = set(z.namelist())
                  for required in ('InterfaceScout/backend/app.py','InterfaceScout/frontend/index.html','InterfaceScout/examples/README.md','InterfaceScout/README.md'):
                      assert required in names, (archive, required)
          print('Four source distributions verified.')
          PY
      - name: Update original rc1 tag to tested commit
        if: steps.guard.outputs.apply == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1.1.0-rc1 "${GITHUB_SHA_FOR_RELEASE}"
          git push origin +refs/tags/v1.1.0-rc1:refs/tags/v1.1.0-rc1
        env:
          GITHUB_SHA_FOR_RELEASE: ${{ github.event.workflow_run.head_sha }}
      - name: Replace rc1 assets in existing GitHub Release
        if: steps.guard.outputs.apply == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.1.0-rc1 >/dev/null
          gh release delete-asset v1.1.0-rc1 InterfaceScout_v1.1.0_rc1_publication_bundle.zip.sha256 --yes || true
          gh release upload v1.1.0-rc1 dist/*.zip dist/SHA256SUMS.txt --clobber
          echo "Updated release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v1.1.0-rc1"
