name: Generate InterfaceScout examples

on:
  workflow_dispatch:
  push:
    branches: [simplify-examples]
    paths:
      - 'backend/generate_examples.py'
      - '.github/workflows/generate_examples.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r backend/requirements-publication-lock.txt
          pip install openpyxl
      - name: Generate examples from current InterfaceScout code
        working-directory: backend
        run: python generate_examples.py
      - name: Commit examples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples
          git commit -m "Generate InterfaceScout example outputs" || exit 0
          git push
