name: InterfaceScout consensus core parameter selection

on:
  push:
    paths:
      - 'backend/v2/validation/select_core_parameters_consensus.py'
      - '.github/workflows/core_parameter_selection_consensus.yml'
  workflow_dispatch:

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - run: pip install -r backend/requirements-publication-lock.txt
      - name: Run consensus parameter selection
        working-directory: backend
        env:
          INTERFACESCOUT_VALIDATION_CANONICAL_ONLY: '1'
        run: python -m v2.validation.select_core_parameters_consensus
      - uses: actions/upload-artifact@v4
        with:
          name: interfacescout-core-parameter-selection-consensus
          path: |
            backend/core_parameter_selection_consensus.json
            backend/selection_pdbs
